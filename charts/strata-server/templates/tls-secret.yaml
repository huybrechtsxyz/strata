{{- if and .Values.tls.selfSigned (not .Values.tls.secretName) }}
{{- $fullName := include "strata-server.fullname" . }}
{{- $secretName := printf "%s-tls" $fullName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "strata-server.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $existing }}
  # Reuse the cert generated on a previous install/upgrade instead of
  # regenerating it every time — a fresh cert on every 'helm upgrade' would
  # change this Secret's content and needlessly restart the server pod.
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert $fullName nil (list $fullName (printf "%s.%s.svc.cluster.local" $fullName .Release.Namespace)) 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
