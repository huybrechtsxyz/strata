{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "strata-server.postgresFullname" . }}
  labels:
    {{- include "strata-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "strata-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
{{- end }}
