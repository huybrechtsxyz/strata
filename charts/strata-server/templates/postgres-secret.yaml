{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strata-server.postgresFullname" . }}
  labels:
    {{- include "strata-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "Set postgresql.auth.password (or postgresql.auth.existingSecret)" .Values.postgresql.auth.password | quote }}
{{- end }}
