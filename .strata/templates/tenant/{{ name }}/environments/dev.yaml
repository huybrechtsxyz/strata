apiVersion: strata.huybrechts.xyz/v1
kind: environment
meta:
  name: {{ name }}_dev
  annotations:
    description: "Development environment for {{ name }}"
  labels:
    version: "1.0.0"
spec:
  variables:
    - key: ENVIRONMENT
      store: constant
      value: dev
  overrides:
    providers:
      - provider: primary
        configuration:
          env_tag: dev
          # region: eastus      # uncomment to override provider region
