apiVersion: strata.huybrechts.xyz/v1
kind: environment
meta:
  name: {{ name }}_qa
  annotations:
    description: "QA environment for {{ name }}"
  labels:
    version: "1.0.0"
spec:
  variables:
    - key: ENVIRONMENT
      store: constant
      value: qa
  overrides:
    providers:
      - provider: primary
        configuration:
          env_tag: qa
          # region: eastus      # uncomment to override provider region
