# ==============================================================================
# Workflow Name : Deploy Workspace
# Description   : This workflow manages the lifecycle of a workspace, including
#                 setup, validation, and teardown.
#
# Triggers :
#     - [ ] push
#     - [ ] pull_request
#     - [ ] schedule
#     - [ ] workflow_dispatch
#     - [x] workflow_call
#
# Environment :
#     - OS        : ubuntu-latest
#     - Language  : Bash / Python
#
# Notes :
#     - This workflow is designed to be reusable across different workspaces.
# ==============================================================================

name: Deploy Workspace

on:
  workflow_call:
    inputs:
      # Determines what workspace to deploy
      deployment_file:
        description: "Deployment configuration and environment file for the workspace"
        required: true
        type: string
      # Controls whether provisioners apply changes or only plan.
      # Defaults to true (plan-only / dry run) — safe for PRs and branch builds.
      # Set to false on the calling workflow to perform a real deployment.
      dry_run:
        description: "Run in dry-run mode (plan only, no apply). Set to false to deploy."
        required: false
        type: boolean
        default: true
      # Azure store credentials (azure-keyvault, azure-appconfig)
      azure_tenant_id:
        description: "Azure tenant ID"
        required: false
        type: string
      azure_subscription_id:
        description: "Azure subscription ID"
        required: false
        type: string
      azure_client_id:
        description: "Azure service principal client ID"
        required: false
        type: string
      # HashiCorp Vault store address
      vault_address:
        description: "HashiCorp Vault server address"
        required: false
        type: string
      # Consul store address
      consul_address:
        description: "Consul server address"
        required: false
        type: string
    secrets:
      # Bitwarden store (bitwarden)
      bitwarden_token:
        required: false
      # Azure store credentials (azure-keyvault, azure-appconfig)
      azure_client_secret:
        required: false
      # HashiCorp Vault store token (vault)
      vault_token:
        required: false
      # Consul store token (consul)
      consul_token:
        required: false

# Permissions for the workflow
# id-token: write is required for OIDC authentication with Azure.
# It is harmless when client-secret auth is used instead.
permissions:
  contents: read
  id-token: write

# Prevent concurrent deploys of the same workspace (Terraform state locks, etc.)
# cancel-in-progress: false — let the running deploy finish rather than leaving infra mid-apply.
concurrency:
  group: deploy-${{ inputs.deployment_file }}
  cancel-in-progress: false

jobs:
  # Single job — validate inputs, build the platform artifact, then deploy.
  # dry_run=true (default) → plan only (strata deploy run --dry-run).
  # dry_run=false          → full deploy (all stages applied).
  run:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to access deployment files and actions.
      - name: Check Out
        uses: actions/checkout@v4

      # Install yq (used to extract values from YAML deployment files)
      - name: Setup YQ
        uses: huybrechtsxyz/strata/.github/actions/setup-yq@deployment-bugs

      # Install uv / python and strata
      - name: Setup Strata
        uses: huybrechtsxyz/strata/.github/actions/setup-strata@deployment-bugs
        with:
          python-version: "3.13"

      # Validate the deployment file structure and schema
      - name: Validate Deployment
        uses: huybrechtsxyz/strata/.github/actions/validate-deployment@deployment-bugs
        with:
          deployment_file: ${{ inputs.deployment_file }}

      # Extract the deployment name from the file for use in downstream steps
      - name: Get Deployment Name
        id: get_name
        uses: huybrechtsxyz/strata/.github/actions/get-deployment-name@deployment-bugs
        with:
          deployment_file: ${{ inputs.deployment_file }}

      # Authenticate with Azure (OIDC or client secret — mode is auto-detected).
      # Must run before Verify Integrations so the az CLI session is active.
      - name: Azure Login
        uses: huybrechtsxyz/strata/.github/actions/azure-login@deployment-bugs
        with:
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_client_secret: ${{ secrets.azure_client_secret }}

      # Verify all configured store integrations are reachable before proceeding
      - name: Verify Integrations
        uses: huybrechtsxyz/strata/.github/actions/verify-integrations@deployment-bugs
        with:
          bitwarden_token: ${{ secrets.bitwarden_token }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_client_secret: ${{ secrets.azure_client_secret }}
          vault_address: ${{ inputs.vault_address }}
          vault_token: ${{ secrets.vault_token }}
          consul_address: ${{ inputs.consul_address }}
          consul_token: ${{ secrets.consul_token }}

      # Build the platform artifact (writes output to .strata/)
      - name: Build
        uses: huybrechtsxyz/strata/.github/actions/build-deployment@deployment-bugs
        with:
          deployment_file: ${{ inputs.deployment_file }}

      # dry_run=true (default) → plan only. dry_run=false → full deploy.
      - name: Deploy
        uses: huybrechtsxyz/strata/.github/actions/run-deployment@deployment-bugs
        with:
          deployment_file: ${{ inputs.deployment_file }}
          deployment_name: ${{ steps.get_name.outputs.deployment_name }}
          dry_run: ${{ inputs.dry_run }}
