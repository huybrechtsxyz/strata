##
# Publish workflow: triggered on tag push (vX.Y.Z).
# - Builds distribution and uploads to TestPyPI using `TEST_PYPI_TOKEN`.
# - Optional PyPI publish can be enabled by setting `PUBLISH_PYPI=true` and
#   providing `PYPI_TOKEN` as a repo secret. This workflow is intended for
#   automated releases from CI when tags are pushed.
#
name: Publish package (TestPyPI on tag)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build & twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build distribution
        run: python -m build

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          python -m twine upload --repository testpypi dist/*

      - name: Publish to PyPI (manual opt-in)
        if: env.PUBLISH_PYPI == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload dist/*
