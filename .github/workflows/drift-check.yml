# Drift Detection — Reusable Workflow
#
# Runs nightly to detect configuration drift between Terraform state and declared config.
# Exit code 3 = drift detected. Exit code 0 = clean.
#
# Usage (in your repo's workflow):
#
#   jobs:
#     drift:
#       uses: huybrechtsxyz/strata/.github/workflows/drift-check.yml@main
#       with:
#         deployment: deploy/production.yaml
#         severity: high
#       secrets: inherit
#
# Required secrets (set in your repo/environment):
#   AZURE_CLIENT_ID      — Azure service principal client ID
#   AZURE_CLIENT_SECRET  — Azure service principal secret
#   AZURE_TENANT_ID      — Azure tenant ID
#   SLACK_DRIFT_WEBHOOK  — (optional) Slack incoming webhook URL

name: Infrastructure Drift Detection

on:
  # Run nightly at 02:00 UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger with configurable options
  workflow_dispatch:
    inputs:
      deployment:
        description: "Path to deployment YAML file"
        required: false
        default: ""
      severity:
        description: "Minimum severity that causes exit code 3 (critical/high/medium/low/info)"
        required: false
        default: "high"
      baseline:
        description: "Set current state as baseline (acknowledge all drift, reset history)"
        type: boolean
        required: false
        default: false

  # Callable from other workflows
  workflow_call:
    inputs:
      deployment:
        description: "Path to deployment YAML file"
        type: string
        required: true
      severity:
        description: "Minimum severity threshold"
        type: string
        required: false
        default: "high"
      baseline:
        description: "Set baseline mode"
        type: boolean
        required: false
        default: false
      python-version:
        description: "Python version to use"
        type: string
        required: false
        default: "3.13"
      strata-version:
        description: "Strata version to install (empty = latest)"
        type: string
        required: false
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      SLACK_DRIFT_WEBHOOK:
        required: false

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:
  drift-check:
    name: Drift Check — ${{ inputs.deployment || 'all deployments' }}
    runs-on: ubuntu-latest

    # Permissions needed for commenting on PRs (optional) and OIDC auth
    permissions:
      contents: read
      id-token: write # Required for OIDC Azure login (no stored secret needed)

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python + strata
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install strata CLI
        run: |
          if [ -n "${{ inputs.strata-version }}" ]; then
            pip install "xyz-strata==${{ inputs.strata-version }}"
          else
            pip install xyz-strata
          fi
          strata --version

      # -----------------------------------------------------------------------
      # 3. Authenticate to cloud (Azure example — adapt for AWS/GCP)
      # -----------------------------------------------------------------------
      - name: Authenticate to Azure (service principal)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant  "${{ secrets.AZURE_TENANT_ID }}"
        env:
          AZURE_CONFIG_DIR: /tmp/.azure

      # -----------------------------------------------------------------------
      # 4. Build deployment artifacts (required before drift detection)
      # -----------------------------------------------------------------------
      - name: Build deployment artifacts
        run: |
          FILE="${{ inputs.deployment }}"
          if [ -n "$FILE" ]; then
            strata build run -f "$FILE" --output json
          else
            echo "No deployment file specified; skipping build step."
          fi
        env:
          STRATA_OUTPUT: json

      # -----------------------------------------------------------------------
      # 5. Detect drift
      # -----------------------------------------------------------------------
      - name: Detect drift
        id: drift
        run: |
          FILE="${{ inputs.deployment }}"
          SEVERITY="${{ inputs.severity || 'high' }}"
          BASELINE_FLAG=""
          if [ "${{ inputs.baseline }}" = "true" ]; then
            BASELINE_FLAG="--baseline"
          fi

          if [ -n "$FILE" ]; then
            strata deploy drift run \
              -f "$FILE" \
              --severity "$SEVERITY" \
              $BASELINE_FLAG \
              --output json > drift-report.json
          else
            echo '{"success":true,"data":{"has_drift":false,"entries":[]}}' > drift-report.json
          fi

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Surface summary as step output
          if command -v jq &>/dev/null; then
            TOTAL=$(jq -r '.data.summary.total // 0' drift-report.json 2>/dev/null || echo 0)
            CRITICAL=$(jq -r '.data.summary.critical // 0' drift-report.json 2>/dev/null || echo 0)
            HIGH=$(jq -r '.data.summary.high // 0' drift-report.json 2>/dev/null || echo 0)
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
          fi

          exit $EXIT_CODE
        continue-on-error: true # we handle exit code explicitly below
        env:
          STRATA_OUTPUT: json

      # -----------------------------------------------------------------------
      # 6. Upload drift report as artifact
      # -----------------------------------------------------------------------
      - name: Upload drift report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: drift-report.json
          retention-days: 90

      # -----------------------------------------------------------------------
      # 7. Post critical drift to Slack (optional)
      # -----------------------------------------------------------------------
      - name: Post drift summary to Slack
        if: |
          steps.drift.outputs.exit_code == '3' &&
          secrets.SLACK_DRIFT_WEBHOOK != ''
        run: |
          DEPLOYMENT="${{ inputs.deployment || 'unknown' }}"
          TOTAL="${{ steps.drift.outputs.total || '?' }}"
          CRITICAL="${{ steps.drift.outputs.critical || '0' }}"
          HIGH="${{ steps.drift.outputs.high || '0' }}"

          ENTRIES=$(python3 - <<'EOF'
          import json, sys
          try:
              with open("drift-report.json") as f:
                  report = json.load(f)
              entries = report.get("data", {}).get("entries", [])
              lines = []
              for e in entries[:10]:  # limit to 10 entries in Slack message
                  sev = e.get("severity", "?").upper()
                  addr = e.get("address", "?")
                  action = e.get("action", "?")
                  lines.append(f"• [{sev}] {addr} ({action})")
              if len(entries) > 10:
                  lines.append(f"... and {len(entries) - 10} more")
              print("\n".join(lines))
          except Exception as ex:
              print(f"(failed to parse report: {ex})")
          EOF
          )

          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'text': ':rotating_light: *Drift detected* in \`$DEPLOYMENT\`',
            'blocks': [
              {'type': 'section', 'text': {'type': 'mrkdwn',
                'text': ':rotating_light: *Infrastructure drift detected*\n'
                        '*Deployment:* \`$DEPLOYMENT\`\n'
                        '*Total:* $TOTAL entries ($CRITICAL critical, $HIGH high)\n'
                        '*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>'
              }},
              {'type': 'section', 'text': {'type': 'mrkdwn', 'text': '\`\`\`${ENTRIES}\`\`\`'}}
            ]
          }
          print(json.dumps(payload))
          ")

          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_DRIFT_WEBHOOK }}"

      # -----------------------------------------------------------------------
      # 8. Fail the job if drift was found above threshold
      # -----------------------------------------------------------------------
      - name: Fail on drift
        if: steps.drift.outputs.exit_code == '3'
        run: |
          echo "::error::Drift detected. See drift-report artifact for details."
          exit 3

      - name: Clean result
        if: steps.drift.outputs.exit_code == '0'
        run: echo "No drift detected at or above the '${{ inputs.severity || 'high' }}' threshold."
