# ===============================================================================
# Script Name   : ci-build.yaml
# Author        : Vincent Huybrechts
# Version       : 1.0.0
# Python Version: 3.13+
# Description   : GitHub Actions workflow for CI build: lint, format-check,
#                 type-check, pytest, and Sphinx docs validation. Triggered on
#                 push to main/v2 and on pull requests targeting main/v2 (v2
#                 added so alpha/beta releases can be tagged/published from
#                 the v2 development branch without touching main, which
#                 remains the real v1 production release line). Builds the
#                 Python package with uv and uploads dist/ as a GitHub artifact
#                 for ci-release. Also builds the VS Code extension .vsix
#                 (same artifact-as-store pattern) for ci-release's
#                 publish-vscode job.
# ===============================================================================

name: "CI Build"

# Default workflow header: permissions, concurrency, environment and runner defaults
permissions:
  contents: read
  actions: write # required to upload artifacts and GHA cache

# Ensure a single run per ref and cancel in-progress runs on updates
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default shell for all run steps
defaults:
  run:
    shell: bash

# Environment variables
env:
  PYTHON_VERSION: "3.13"

# Trigger on push to main/v2 and on pull requests targeting main/v2
on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v7

      # Install Python and uv, sync dependencies
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint, type-check, and test
      - name: Test Python
        uses: ./.github/actions/test-python

      # Build the Python package (wheel + sdist)
      - name: Build package
        run: uv build

      # Upload dist artifact for use by ci-release
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Validate Sphinx documentation (runs in parallel with build)
  # ---------------------------------------------------------------------------
  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Add the docs optional-dependency extra on top of the dev install
      - name: Install doc dependencies
        run: uv sync --frozen --extra docs

      # Treat warnings as errors (-W) so broken refs / missing modules fail fast
      - name: Build Sphinx docs
        run: uv run sphinx-build -b html docs/ /tmp/html_out -W --keep-going

  # ---------------------------------------------------------------------------
  # Job 3: Build VS Code extension .vsix (runs in parallel with build/docs)
  #
  # Ported from v1 (e:\SourcesXYZ\strata's ci-build.yml) with one deliberate
  # drop: v1's "Sync help files for extension" step (copies docs/help/*.md
  # into resources/help/) has no v2 equivalent to sync from yet (v2 has no
  # docs/help/ directory) — omitted rather than left as a step that would
  # fail on every run; re-add once v2 has that content.
  # ---------------------------------------------------------------------------
  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json

      - name: Install Node dependencies
        working-directory: src/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: src/vscode
        run: npx tsc -p tsconfig.json --noEmit false

      - name: Copy LICENSE into extension directory
        run: cp LICENSE src/vscode/LICENSE

      - name: Package extension (.vsix)
        working-directory: src/vscode
        run: |
          mkdir -p ${{ github.workspace }}/dist
          npx @vscode/vsce package --no-dependencies --out ${{ github.workspace }}/dist/

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 7
