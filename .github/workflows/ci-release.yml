# ===============================================================================
# Script Name   : ci-release.yaml
# Author        : Vincent Huybrechts
# Version       : 1.0.0
# Python Version: 3.13+
# Description   : Creates a GitHub Release from the dist artifact produced by
#                 ci-build.yaml (artifacts as store pattern), then builds and
#                 pushes a versioned Docker image to GHCR.
#                 Triggered on tag push vX.Y.Z.
# ===============================================================================

name: "CI Release"

# Restrict to least privilege; contents: write required to create a GitHub Release
permissions:
  contents: write
  actions: read # required to download artifacts from ci-build
  packages: write # required to push to GHCR
  id-token: write # required for PyPI trusted publishing (OIDC)

# Never cancel an in-progress release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default shell for all run steps
defaults:
  run:
    shell: bash

# Environment variables
env:
  CI: "true"
  PYTHON_VERSION: "3.13"

# Trigger on push of a tag matching vX.Y.Z
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Create GitHub Release and attach the Python package from ci-build
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find-run.outputs.run_id }}

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v7

      # Look up the successful ci-build run for this exact commit so we can
      # download the dist artifact it produced (artifacts as store pattern).
      - name: Find ci-build run for this commit
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=ci-build.yml \
            --commit="${{ github.sha }}" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful ci-build run found for commit ${{ github.sha }}"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found ci-build run: $RUN_ID"

      # Download the dist/ artifact stored by ci-build
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: List dist contents
        run: ls -lh dist/

      # Create the GitHub Release and attach every file from dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
          # A pre-release tag (v2.0.0-alpha1, -beta1, -rc1, ...) contains a
          # '-' per SemVer; a stable tag (v2.0.0) does not. Auto-detected so
          # cutting an alpha/beta/rc tag never marks it "Latest" alongside
          # v1's existing stable releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Publish Python package to PyPI via Trusted Publishing (OIDC)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release.outputs.run_id }}

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # ---------------------------------------------------------------------------
  # Job 3: Publish VS Code extension to the Marketplace
  #
  # Ported from v1 (e:\SourcesXYZ\strata's ci-release.yml), with one
  # deliberate addition: v1 has NO version-format gating at all — it
  # publishes to the Marketplace's stable Release channel on any tag
  # matching 'v*.*.*', including pre-release-suffixed ones (confirmed by
  # direct read, 2026-10-02). The `if:` below is new here: only an exact
  # 'vX.Y.Z' tag (no '-alpha'/'-beta'/'-rc' suffix) ever runs this job, so
  # an alpha/beta tag (like v2.0.0-alpha5) publishes to PyPI (above) but
  # never touches the VS Code Marketplace.
  # ---------------------------------------------------------------------------
  publish-vscode:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 20
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download vsix artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release.outputs.run_id }}

      # The Marketplace gallery API (/_apis/gallery) intermittently fails to
      # respond, and vsce gives up after a 180s request timeout — which
      # would otherwise fail the whole release job for a transient blip.
      #
      # A timeout means the CLIENT gave up, not that the server rejected the
      # request: the publish may well have succeeded server-side. So a retry
      # must treat "version already exists" as success, or the retry itself
      # fails spuriously after a publish that actually worked.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -uo pipefail
          VSIX=$(ls dist/*.vsix | head -n1)
          if [ -z "$VSIX" ]; then
            echo "::error::No .vsix found in dist/"
            exit 1
          fi
          echo "Publishing $VSIX"

          for attempt in 1 2 3; do
            echo "::group::Publish attempt $attempt of 3"
            set +e
            output=$(npx @vscode/vsce publish --packagePath "$VSIX" 2>&1)
            status=$?
            set -e
            echo "$output"
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Published successfully on attempt $attempt."
              exit 0
            fi

            # A prior attempt (or a timed-out request that succeeded server-side)
            # already landed this version — nothing left to do.
            if echo "$output" | grep -qiE 'already exists|already published'; then
              echo "Version is already present on the Marketplace — treating as success."
              exit 0
            fi

            # Auth/validation errors will never succeed on retry — fail fast.
            if echo "$output" | grep -qiE 'unauthorized|access denied|401|invalid publisher'; then
              echo "::error::Authentication or publisher error — not retrying. Check the VSCE_PAT secret."
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 60))
              echo "Attempt $attempt failed (exit $status). Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "::error::vsce publish failed after 3 attempts."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 4: Build and push the CLI Docker image to GHCR
  # ---------------------------------------------------------------------------
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release # only publish if the GitHub Release succeeded

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-compliant tags and labels from the git tag. 'latest' is
      # gated to stable (non-pre-release) tags only — a '-' in the tag name
      # (v2.0.0-alpha1, -beta1, -rc1, ...) means pre-release, per SemVer, and
      # must never overwrite the 'latest' image real consumers pull.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/strata
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build multi-stage CLI image and push; pass the tag as VERSION build arg
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Job 5: Build and push CLI Docker image to Docker Hub (only if registry secrets are set)
  # ---------------------------------------------------------------------------
  publish-hub-cli:
    name: Publish CLI image to Docker Hub
    runs-on: ubuntu-latest
    needs: release
    if: vars.REGISTRY_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/strata
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
