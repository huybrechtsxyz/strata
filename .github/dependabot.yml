# ==============================================================================
# Config Name   : Dependabot
# File Name     : dependabot.yml
# Description   : Dependabot configuration for automated dependency updates
#
# Author        : Vincent Huybrechts
# Created       : 2026-05-07
# Last Updated  : 2026-11-12
# Version       : 1.1.0
# ==============================================================================

version: 2

updates:
  # GitHub Actions — workflows and composite actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # Python — pyproject.toml, and uv.lock with it once a lock is committed (it is git-ignored for now, and the
  # container image resolves pyproject.toml: docs/design/cli-image.md).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # Checkov in the full container image only (docker/checkov/requirements.txt), not the project's dependencies
  - package-ecosystem: "pip"
    directory: "/docker/checkov"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(image)"

  # Container image — the FROM lines of Dockerfile.cli: the Python base image, uv, the Docker CLI, Trivy and OpenTofu
  # (docs/design/cli-image.md). Helm's version is an ARG and is bumped by hand.
  # The Python base image moves by hand, with CI's Python matrix: the image must run a Python strata is tested on.
  # The `3.x-slim` tag picks up patch releases on its own.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(image)"
