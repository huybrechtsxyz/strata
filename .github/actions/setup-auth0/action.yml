# ===============================================================================
# Action Name  : setup-auth0
# Description  : Configure credentials for strata's auth0 identity
#                integration. API-only.
# ===============================================================================

name: "Setup Auth0"
description: "Configure Auth0 client credentials for strata's auth0 identity integration."

branding:
  icon: "key"
  color: "gray-dark"

inputs:
  domain:
    description: "Auth0 tenant domain (e.g. 'my-tenant.us.auth0.com')."
    required: true
  client-id:
    description: "Auth0 application client ID."
    required: true
  client-secret:
    description: "Auth0 application client secret."
    required: false
    default: ""
  domain-env-var:
    description: "Env var name the domain is written to."
    required: false
    default: "AUTH0_DOMAIN"
  client-id-env-var:
    description: "Env var name the client ID is written to."
    required: false
    default: "AUTH0_CLIENT_ID"
  client-secret-env-var:
    description: "Env var name the client secret is written to."
    required: false
    default: "AUTH0_CLIENT_SECRET"

runs:
  using: composite
  steps:
    - name: Configure Auth0 Environment Variables
      shell: bash
      env:
        _DOMAIN: ${{ inputs.domain }}
        _CLIENT_ID: ${{ inputs.client-id }}
        _CLIENT_SECRET: ${{ inputs.client-secret }}
        _DOMAIN_VAR: ${{ inputs.domain-env-var }}
        _ID_VAR: ${{ inputs.client-id-env-var }}
        _SECRET_VAR: ${{ inputs.client-secret-env-var }}
      run: |
        [ -n "$_CLIENT_SECRET" ] && echo "::add-mask::$_CLIENT_SECRET"
        _write_env() {
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$1" "$2" >> "$GITHUB_ENV"
        }
        _write_env "$_DOMAIN_VAR" "$_DOMAIN"
        _write_env "$_ID_VAR" "$_CLIENT_ID"
        [ -n "$_CLIENT_SECRET" ] && _write_env "$_SECRET_VAR" "$_CLIENT_SECRET"
        echo "[+] Auth0 configured"
