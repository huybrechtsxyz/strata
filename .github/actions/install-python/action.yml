# ===============================================================================
# Action Name  : install-python
# Description  : Install Python, uv, and sync project dependencies from the
#                local repo. Required before any strata dev/CI action.
# ===============================================================================

name: "Install Python"
description: "Install Python, uv, and sync project dependencies (uv sync --frozen)."

inputs:
  python-version:
    description: "Python version to install."
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        sync: false

    - name: Sync dependencies
      shell: bash
      run: uv sync --frozen
