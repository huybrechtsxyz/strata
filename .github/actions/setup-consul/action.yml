# ===============================================================================
# Action Name  : setup-consul
# Description  : Install the HashiCorp Consul CLI and configure credentials.
#                strata's ConsulIntegration shells out to the real `consul`
#                binary — the CLI is REQUIRED, not optional.
# ===============================================================================

name: "Setup Consul"
description: "Install the HashiCorp Consul CLI and configure authentication for strata's hashicorp_consul integration."

branding:
  icon: "lock"
  color: "red"

inputs:
  address:
    description: "Consul server address (CONSUL_HTTP_ADDR)."
    required: true
  token:
    description: "Consul ACL token (CONSUL_HTTP_TOKEN)."
    required: true
  namespace:
    description: "Consul Enterprise namespace (CONSUL_NAMESPACE)."
    required: false
    default: ""
  consul-version:
    description: "Consul CLI version to install (e.g. '1.19.2'). Defaults to latest from the HashiCorp apt repo."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Consul CLI (HashiCorp apt repo)
      shell: bash
      env:
        _VERSION: ${{ inputs.consul-version }}
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update -y
        if [ -n "$_VERSION" ]; then
          sudo apt-get install -y "consul=${_VERSION}-1"
        else
          sudo apt-get install -y consul
        fi
        consul version

    - name: Configure Consul Environment Variables
      shell: bash
      env:
        _ADDRESS: ${{ inputs.address }}
        _TOKEN: ${{ inputs.token }}
        _NAMESPACE: ${{ inputs.namespace }}
      run: |
        echo "::add-mask::$_TOKEN"
        _write_env() {
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$1" "$2" >> "$GITHUB_ENV"
        }
        _write_env CONSUL_HTTP_ADDR "$_ADDRESS"
        _write_env CONSUL_HTTP_TOKEN "$_TOKEN"
        [ -n "$_NAMESPACE" ] && _write_env CONSUL_NAMESPACE "$_NAMESPACE"
        echo "[+] Consul configured"
