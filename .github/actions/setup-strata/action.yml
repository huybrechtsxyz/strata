# ===============================================================================
# Action Name  : setup-strata
# Description  : Install Python, uv, and the strata CLI tool.
#                All other strata actions require this as a prerequisite.
# ===============================================================================

name: "Setup Strata"
description: "Install Python, uv, and the strata CLI. Required before any other strata action."

branding:
  icon: "terminal"
  color: "blue"

inputs:
  strata-version:
    description: "Strata version to install (e.g., 'latest', '2.1.0', '>=2.0'). Use 'local' to install from the current repo."
    required: false
    default: "latest"
  strata-ref:
    description: "Git branch/tag/SHA to install strata from (e.g., 'deployment-bugs'). Overrides strata-version when set."
    required: false
    default: ""
  python-version:
    description: "Python version to install."
    required: false
    default: "3.13"

outputs:
  version:
    description: "Installed strata version string."
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Install strata
      shell: bash
      env:
        _STRATA_REF: ${{ inputs.strata-ref }}
        _STRATA_VERSION: ${{ inputs.strata-version }}
      run: |
        if [ -n "$_STRATA_REF" ]; then
          uv tool install "xyz-strata @ git+https://github.com/huybrechtsxyz/strata.git@${_STRATA_REF}"
        elif [ "$_STRATA_VERSION" = "local" ]; then
          uv tool install --from .
        elif [ "$_STRATA_VERSION" = "latest" ]; then
          uv tool install xyz-strata
        elif [[ "$_STRATA_VERSION" =~ ^(==|!=|>=|<=|~=|>|<) ]]; then
          # Already a valid PEP 440 specifier (e.g. '>=2.0') — use as-is.
          uv tool install "xyz-strata${_STRATA_VERSION}"
        else
          # Bare version (e.g. '2.1.0') — pin to an exact match.
          uv tool install "xyz-strata==${_STRATA_VERSION}"
        fi

    - name: Verify installation
      id: version
      shell: bash
      run: |
        VERSION=$(strata --version | head -1)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "✅ strata ${VERSION} installed"
        printf '**strata %s** installed ✅\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
