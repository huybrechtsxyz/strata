# ===============================================================================
# Action Name  : setup-terraform-cli
# Description  : Install Terraform for strata's terraform integration. Wraps
#                hashicorp/setup-terraform. Optionally configures Terraform
#                Cloud/Enterprise API token (TF_TOKEN_<hostname>).
# ===============================================================================

name: "Setup Terraform"
description: "Install Terraform and optionally configure Terraform Cloud credentials for strata's terraform integration."

branding:
  icon: "layers"
  color: "purple"

inputs:
  terraform-version:
    description: "Terraform version to install (e.g. '1.9.5'). Defaults to latest."
    required: false
    default: "latest"
  cloud-hostname:
    description: "Terraform Cloud/Enterprise hostname (default: app.terraform.io)."
    required: false
    default: "app.terraform.io"
  cloud-token:
    description: "Terraform Cloud/Enterprise API token. Written as TF_TOKEN_<hostname_with_underscores>."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
        cli_config_credentials_hostname: ${{ inputs.cloud-hostname }}
        cli_config_credentials_token: ${{ inputs.cloud-token }}

    - name: Configure Terraform Cloud Token (fallback env var)
      if: ${{ inputs.cloud-token != '' }}
      shell: bash
      env:
        _TOKEN: ${{ inputs.cloud-token }}
        _HOSTNAME: ${{ inputs.cloud-hostname }}
      run: |
        echo "::add-mask::$_TOKEN"
        VAR_NAME="TF_TOKEN_$(echo "$_HOSTNAME" | tr '.' '_')"
        printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$VAR_NAME" "$_TOKEN" >> "$GITHUB_ENV"
        echo "[+] Terraform Cloud token configured ($VAR_NAME)"

    - name: Verify Terraform
      shell: bash
      run: terraform version
