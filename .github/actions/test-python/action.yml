# ===============================================================================
# Action Name  : test-python
# Description  : Run ruff lint, ruff format check, mypy type-check, and pytest.
#                Requires setup-python to have run first.
# ===============================================================================

name: "Test Python"
description: "Run ruff lint, ruff format check, mypy, and pytest."

runs:
  using: composite
  steps:
    - name: Ruff lint
      shell: bash
      run: uv run ruff check ./src ./tests

    - name: Ruff format
      shell: bash
      run: uv run ruff format --check ./src ./tests

    - name: Mypy type check
      shell: bash
      run: uv run python -m mypy ./src

    - name: Import layering (lint-imports)
      shell: bash
      run: uv run lint-imports

    # -n auto: one pytest-xdist worker per runner core. --dist loadfile keeps a test file on one
    # worker, so module-scoped fixtures (the scale tests' large solutions) are built once.
    - name: Pytest
      shell: bash
      run: uv run pytest -q -n auto --dist loadfile
