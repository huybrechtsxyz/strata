# ===============================================================================
# Action Name  : validate
# Description  : Run strata validate against a deployment file.
#                Returns structured outputs for use in workflow conditions.
# ===============================================================================

name: "Strata Validate"
description: "Validate a strata deployment file. Fails on exit code 3 (validation error) unless continue-on-error is set."

inputs:
  file:
    description: "Path to the deployment YAML file."
    required: true
  work-path:
    description: "Workspace root directory."
    required: false
    default: "."
  extra-args:
    description: "Additional arguments to pass to strata validate."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Numeric exit code (0=success, 1=system error, 2=usage error, 3=validation failure)."
    value: ${{ steps.run.outputs.exit-code }}
  success:
    description: "Whether validation passed (true/false)."
    value: ${{ steps.run.outputs.success }}
  result:
    description: "Raw JSON output from strata validate."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run strata validate
      id: run
      shell: bash
      run: |
        set +e
        RESULT=$(strata validate --file "${{ inputs.file }}" --work-path "${{ inputs.work-path }}" --output json ${{ inputs.extra-args }} 2>&1)
        EXIT_CODE=$?
        set -e

        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "${RESULT}" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "success=true" >> "$GITHUB_OUTPUT"
          echo "✅ Validation passed"
        else
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "❌ Validation failed (exit code ${EXIT_CODE})"
        fi

        # Write step summary
        echo "### Strata Validate" >> "$GITHUB_STEP_SUMMARY"
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "✅ **Passed**" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ **Failed** (exit code ${EXIT_CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

        exit ${EXIT_CODE}
