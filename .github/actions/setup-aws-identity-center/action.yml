# ===============================================================================
# Action Name  : setup-aws-identity-center
# Description  : Configure credentials for strata's aws_identity_center
#                identity integration. API-only.
# ===============================================================================

name: "Setup AWS Identity Center"
description: "Configure AWS IAM Identity Center (SSO) credentials for strata's aws_identity_center integration."

branding:
  icon: "key"
  color: "orange"

inputs:
  client-id:
    description: "AWS IAM Identity Center application client ID."
    required: true
  client-secret:
    description: "AWS IAM Identity Center application client secret."
    required: false
    default: ""
  region:
    description: "AWS region (AWS_DEFAULT_REGION)."
    required: true
  client-id-env-var:
    description: "Env var name the client ID is written to."
    required: false
    default: "AWS_IDC_CLIENT_ID"
  client-secret-env-var:
    description: "Env var name the client secret is written to."
    required: false
    default: "AWS_IDC_CLIENT_SECRET"

runs:
  using: composite
  steps:
    - name: Configure AWS Identity Center Environment Variables
      shell: bash
      env:
        _CLIENT_ID: ${{ inputs.client-id }}
        _CLIENT_SECRET: ${{ inputs.client-secret }}
        _REGION: ${{ inputs.region }}
        _ID_VAR: ${{ inputs.client-id-env-var }}
        _SECRET_VAR: ${{ inputs.client-secret-env-var }}
      run: |
        [ -n "$_CLIENT_SECRET" ] && echo "::add-mask::$_CLIENT_SECRET"
        _write_env() {
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$1" "$2" >> "$GITHUB_ENV"
        }
        _write_env "$_ID_VAR" "$_CLIENT_ID"
        [ -n "$_CLIENT_SECRET" ] && _write_env "$_SECRET_VAR" "$_CLIENT_SECRET"
        _write_env AWS_DEFAULT_REGION "$_REGION"
        echo "[+] AWS Identity Center configured"
