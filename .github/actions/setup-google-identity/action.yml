# ===============================================================================
# Action Name  : setup-google-identity
# Description  : Configure credentials for strata's google identity
#                integration (CLI login via Google Identity). Reuses gcloud
#                when present, but does not require it — API-only.
# ===============================================================================

name: "Setup Google Identity"
description: "Configure Google OAuth2 client credentials for strata's google identity integration."

branding:
  icon: "key"
  color: "green"

inputs:
  client-id:
    description: "Google OAuth2 client ID."
    required: true
  client-secret:
    description: "Google OAuth2 client secret."
    required: false
    default: ""
  client-id-env-var:
    description: "Env var name the client ID is written to."
    required: false
    default: "GOOGLE_OAUTH_CLIENT_ID"
  client-secret-env-var:
    description: "Env var name the client secret is written to."
    required: false
    default: "GOOGLE_OAUTH_CLIENT_SECRET"

runs:
  using: composite
  steps:
    - name: Configure Google Identity Environment Variables
      shell: bash
      env:
        _CLIENT_ID: ${{ inputs.client-id }}
        _CLIENT_SECRET: ${{ inputs.client-secret }}
        _ID_VAR: ${{ inputs.client-id-env-var }}
        _SECRET_VAR: ${{ inputs.client-secret-env-var }}
      run: |
        [ -n "$_CLIENT_SECRET" ] && echo "::add-mask::$_CLIENT_SECRET"
        _write_env() {
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$1" "$2" >> "$GITHUB_ENV"
        }
        _write_env "$_ID_VAR" "$_CLIENT_ID"
        [ -n "$_CLIENT_SECRET" ] && _write_env "$_SECRET_VAR" "$_CLIENT_SECRET"
        echo "[+] Google identity configured"
