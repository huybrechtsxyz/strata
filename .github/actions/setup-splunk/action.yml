# ===============================================================================
# Action Name  : setup-splunk
# Description  : Configure credentials for strata's splunk SIEM sink
#                integration (HTTP Event Collector). HTTP-based.
# ===============================================================================

name: "Setup Splunk"
description: "Configure Splunk HTTP Event Collector (HEC) credentials for strata's splunk integration."

branding:
  icon: "shield"
  color: "black"

inputs:
  hec-endpoint:
    description: "Splunk HEC endpoint URL (matches the deployment YAML's endpoints.address)."
    required: true
  hec-token:
    description: "Splunk HEC token."
    required: true
  hec-token-env-var:
    description: "Env var name the token is written to (referenced by the deployment YAML's secret_ref)."
    required: false
    default: "SPLUNK_HEC_TOKEN"

runs:
  using: composite
  steps:
    - name: Configure Splunk Environment Variables
      shell: bash
      env:
        _TOKEN: ${{ inputs.hec-token }}
        _TOKEN_VAR: ${{ inputs.hec-token-env-var }}
        _ENDPOINT: ${{ inputs.hec-endpoint }}
      run: |
        echo "::add-mask::$_TOKEN"
        printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$_TOKEN_VAR" "$_TOKEN" >> "$GITHUB_ENV"
        echo "[+] Splunk configured (endpoint: $_ENDPOINT)"
