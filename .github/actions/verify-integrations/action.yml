# ===============================================================================
# Action Name  : verify-integrations
# Description  : Set env vars for all configured store integrations and verify
#                their availability using `strata tools status --output json`.
#
# Store env var mapping:
#   bitwarden        → BWS_ACCESS_TOKEN
#   azure-keyvault   → AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#                       AZURE_SUBSCRIPTION_ID
#   azure-appconfig  → (same Azure credentials as above)
#   hashicorp-vault  → VAULT_ADDR, VAULT_TOKEN
#   consul           → CONSUL_HTTP_ADDR, CONSUL_HTTP_TOKEN
# ===============================================================================

name: "Verify Integrations"
description: "Configure store env vars and verify integration availability via strata tools status."

branding:
  icon: "check-circle"
  color: "green"

inputs:
  # Bitwarden store
  bitwarden_token:
    description: "Bitwarden Secrets Manager access token (BWS_ACCESS_TOKEN)"
    required: false
    default: ""
  # Azure store (azure-keyvault + azure-appconfig share credentials)
  azure_tenant_id:
    description: "Azure tenant ID (AZURE_TENANT_ID)"
    required: false
    default: ""
  azure_subscription_id:
    description: "Azure subscription ID (AZURE_SUBSCRIPTION_ID)"
    required: false
    default: ""
  azure_client_id:
    description: "Azure service principal client ID (AZURE_CLIENT_ID)"
    required: false
    default: ""
  azure_client_secret:
    description: "Azure service principal client secret (AZURE_CLIENT_SECRET)"
    required: false
    default: ""
  # HashiCorp Vault store
  vault_address:
    description: "HashiCorp Vault server address (VAULT_ADDR)"
    required: false
    default: ""
  vault_token:
    description: "HashiCorp Vault token (VAULT_TOKEN)"
    required: false
    default: ""
  # Consul store
  consul_address:
    description: "Consul server address (CONSUL_HTTP_ADDR)"
    required: false
    default: ""
  consul_token:
    description: "Consul ACL token (CONSUL_HTTP_TOKEN)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Mask secrets so they never appear in logs.
    # Secrets are passed via env: to prevent command injection — a token
    # containing $(cmd) would execute before the mask if interpolated directly
    # into run: via ${{ inputs.* }}.
    - name: Mask Secrets
      shell: bash
      env:
        _BITWARDEN_TOKEN: ${{ inputs.bitwarden_token }}
        _AZURE_CLIENT_SECRET: ${{ inputs.azure_client_secret }}
        _VAULT_TOKEN: ${{ inputs.vault_token }}
        _CONSUL_TOKEN: ${{ inputs.consul_token }}
      run: |
        [ -n "$_BITWARDEN_TOKEN" ]     && echo "::add-mask::$_BITWARDEN_TOKEN"
        [ -n "$_AZURE_CLIENT_SECRET" ] && echo "::add-mask::$_AZURE_CLIENT_SECRET"
        [ -n "$_VAULT_TOKEN" ]         && echo "::add-mask::$_VAULT_TOKEN"
        [ -n "$_CONSUL_TOKEN" ]        && echo "::add-mask::$_CONSUL_TOKEN"
        true

    # Export store credentials as the env vars each integration expects.
    # Each store logs one of three states:
    #   [+] configured          — credentials present, env vars written
    #   [!] partially configured — only one of a required pair was supplied (warning)
    #   [-] not configured      — no credentials provided (ok, store simply won't be used)
    #
    # All inputs are passed via env: to prevent two injection classes:
    #   1. Command injection — ${{ inputs.* }} is expanded by the Actions template
    #      engine before the shell runs; a value containing $(cmd) would execute.
    #   2. Newline injection into GITHUB_ENV — echo "VAR=${{ inputs.* }}" splits on
    #      embedded newlines, letting a secret inject arbitrary env vars downstream.
    #
    # GITHUB_ENV writes use the EOF delimiter format so values containing newlines
    # are stored verbatim without splitting into extra variables.
    - name: Configure Store Environment Variables
      shell: bash
      env:
        _BITWARDEN_TOKEN: ${{ inputs.bitwarden_token }}
        _AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
        _AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
        _AZURE_CLIENT_ID: ${{ inputs.azure_client_id }}
        _AZURE_CLIENT_SECRET: ${{ inputs.azure_client_secret }}
        _VAULT_ADDRESS: ${{ inputs.vault_address }}
        _VAULT_TOKEN: ${{ inputs.vault_token }}
        _CONSUL_ADDRESS: ${{ inputs.consul_address }}
        _CONSUL_TOKEN: ${{ inputs.consul_token }}
      run: |
        # Write VAR=value to GITHUB_ENV using the EOF delimiter format.
        # This is safe against newline injection: the value is written verbatim
        # between the delimiters regardless of embedded newlines.
        _write_env() {
          local name="$1" value="$2"
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$name" "$value" >> "$GITHUB_ENV"
        }

        # Bitwarden — single token
        if [ -n "$_BITWARDEN_TOKEN" ]; then
          _write_env BWS_ACCESS_TOKEN "$_BITWARDEN_TOKEN"
          echo "[+] Bitwarden       : configured"
        else
          echo "[-] Bitwarden       : not configured (ok)"
        fi

        # Azure — client_id and client_secret must both be present
        if [ -n "$_AZURE_CLIENT_ID" ] && [ -n "$_AZURE_CLIENT_SECRET" ]; then
          _write_env AZURE_TENANT_ID       "$_AZURE_TENANT_ID"
          _write_env AZURE_SUBSCRIPTION_ID "$_AZURE_SUBSCRIPTION_ID"
          _write_env AZURE_CLIENT_ID       "$_AZURE_CLIENT_ID"
          _write_env AZURE_CLIENT_SECRET   "$_AZURE_CLIENT_SECRET"
          echo "[+] Azure           : configured"
        elif [ -n "$_AZURE_CLIENT_ID" ] || [ -n "$_AZURE_CLIENT_SECRET" ]; then
          echo "::warning::[!] Azure : partially configured — azure_client_id and azure_client_secret must both be supplied"
        else
          echo "[-] Azure           : not configured (ok)"
        fi

        # HashiCorp Vault — address and token must both be present
        if [ -n "$_VAULT_ADDRESS" ] && [ -n "$_VAULT_TOKEN" ]; then
          _write_env VAULT_ADDR  "$_VAULT_ADDRESS"
          _write_env VAULT_TOKEN "$_VAULT_TOKEN"
          echo "[+] HashiCorp Vault : configured"
        elif [ -n "$_VAULT_ADDRESS" ] || [ -n "$_VAULT_TOKEN" ]; then
          echo "::warning::[!] HashiCorp Vault : partially configured — vault_address and vault_token must both be supplied"
        else
          echo "[-] HashiCorp Vault : not configured (ok)"
        fi

        # Consul — address and token must both be present
        if [ -n "$_CONSUL_ADDRESS" ] && [ -n "$_CONSUL_TOKEN" ]; then
          _write_env CONSUL_HTTP_ADDR  "$_CONSUL_ADDRESS"
          _write_env CONSUL_HTTP_TOKEN "$_CONSUL_TOKEN"
          echo "[+] Consul          : configured"
        elif [ -n "$_CONSUL_ADDRESS" ] || [ -n "$_CONSUL_TOKEN" ]; then
          echo "::warning::[!] Consul : partially configured — consul_address and consul_token must both be supplied"
        else
          echo "[-] Consul          : not configured (ok)"
        fi

    # Verify all integrations and emit a per-integration summary
    - name: Verify Integrations
      shell: bash
      run: |
        echo "[*] Verifying integration status ..."
        strata tools status --output json | tee /tmp/strata-tools-status.json
        echo ""
        echo "[*] Integration availability:"
        jq -r '.data.integrations[] | (if .available then "[+]" else "[-]" end) + " " + .name + (if .version then " (" + .version + ")" else " (not found)" end)' \
          /tmp/strata-tools-status.json
        echo "[*] Verifying integration status ... DONE"
        # Write step summary — markdown table of all integrations
        {
          printf '## Integration Status\n\n'
          printf '| Integration | Available | Version |\n'
          printf '|-------------|:---------:|---------|\n'
          jq -r '.data.integrations[] | "| " + .name + " | " + (if .available then "\u2705" else "\u274c" end) + " | " + (.version // "\u2014") + " |"' \
            /tmp/strata-tools-status.json
          printf '\n'
          TOTAL=$(jq '.data.integrations | length' /tmp/strata-tools-status.json)
          AVAIL=$(jq '[.data.integrations[] | select(.available)] | length' /tmp/strata-tools-status.json)
          printf '_%s/%s integrations available_\n' "$AVAIL" "$TOTAL"
        } >> "$GITHUB_STEP_SUMMARY"
