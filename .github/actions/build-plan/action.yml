# ===============================================================================
# Action Name  : build-plan
# Description  : Show artifact diff + terraform plan without writing to the real
#                build path. Nothing is written — safe for PR previews.
# ===============================================================================

name: "Build Plan"
description: "Show artifact diff + terraform plan without writing to the real build path."

branding:
  icon: "eye"
  color: "blue"

inputs:
  deployment_file:
    description: "Path to the strata deployment YAML file."
    required: true
  stage:
    description: "Limit terraform plan to a single stage."
    required: false
    default: ""
  artifacts_only:
    description: "Skip terraform plan — show artifact diff only."
    required: false
    default: "false"
  work_path:
    description: "Workspace root directory."
    required: false
    default: "."

outputs:
  exit_code:
    description: "Numeric exit code from strata build plan."
    value: ${{ steps.run.outputs.exit_code }}
  has_changes:
    description: "Whether any artifacts or terraform resources would change (true/false)."
    value: ${{ steps.run.outputs.has_changes }}
  result:
    description: "Raw JSON output (the full strata response envelope)."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run strata build plan
      id: run
      shell: bash
      env:
        DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
        STAGE: ${{ inputs.stage }}
        ARTIFACTS_ONLY: ${{ inputs.artifacts_only }}
        WORK_PATH: ${{ inputs.work_path }}
      run: |
        STAGE_FLAG=""
        if [ -n "$STAGE" ]; then
          STAGE_FLAG="--stage $STAGE"
        fi

        ARTIFACTS_ONLY_FLAG=""
        if [ "$ARTIFACTS_ONLY" = "true" ]; then
          ARTIFACTS_ONLY_FLAG="--artifacts-only"
        fi

        set +e
        RESULT=$(strata build plan --file "$DEPLOYMENT_FILE" --work-path "$WORK_PATH" --output json $STAGE_FLAG $ARTIFACTS_ONLY_FLAG 2>&1)
        EXIT_CODE=$?
        set -e

        {
          echo "exit_code=${EXIT_CODE}"
          echo "result<<STRATA_EOF"
          echo "${RESULT}"
          echo "STRATA_EOF"
        } >> "$GITHUB_OUTPUT"

        # Note: strata's JSON output is wrapped in an envelope — fields live
        # under .data, not top-level (base_command.py's envelope: success/data/errors/messages).
        if [ "${EXIT_CODE}" -eq 0 ] && command -v jq &>/dev/null; then
          HAS_CHANGES=$(echo "${RESULT}" | jq -r '
            (.data.artifact_diff // [] | map(select(.status != "unchanged")) | length > 0) or
            (.data.terraform_plan // [] | length > 0)
          ' 2>/dev/null || echo "false")
        else
          HAS_CHANGES="false"
        fi
        echo "has_changes=${HAS_CHANGES}" >> "$GITHUB_OUTPUT"

        {
          echo "### Strata Build Plan"
          if [ "${EXIT_CODE}" -eq 0 ]; then
            echo "✅ **Plan complete** — has_changes=${HAS_CHANGES}"
            echo '```json'
            echo "${RESULT}" | head -100
            echo '```'
          else
            echo "❌ **Plan failed** (exit code ${EXIT_CODE})"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        exit ${EXIT_CODE}
