name: Get Bitwarden
description: Install and authenticate Bitwarden Secrets Manager CLI

inputs:
  bitwarden_token:
    description: Bitwarden session token
    required: true

runs:
  using: composite
  steps:
    - name: Install Bitwarden Secrets Manager CLI
      shell: bash
      run: |
        curl -LO "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-gnu-2.0.0.zip"
        unzip bws-x86_64-unknown-linux-gnu-2.0.0.zip
        sudo mv bws /usr/local/bin/
        bws --version  # should output: 2.0.0

    - name: Authenticate with Bitwarden Secrets Manager
      shell: bash
      env:
        BWS_ACCESS_TOKEN: ${{ inputs.bitwarden_token }}
      run: |
        # Set both BWS_ACCESS_TOKEN for bws CLI for XYZ Platform CLI
        export BWS_ACCESS_TOKEN=$BWS_ACCESS_TOKEN
        echo "BWS_ACCESS_TOKEN=$BWS_ACCESS_TOKEN" >> $GITHUB_ENV

        # Test authentication
        bws run -- echo "Testing deployment of Bitwarden Secrets Manager"
