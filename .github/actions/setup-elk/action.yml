# ===============================================================================
# Action Name  : setup-elk
# Description  : Configure credentials for strata's elk SIEM sink
#                integration. HTTP-based — no CLI binary.
# ===============================================================================

name: "Setup ELK"
description: "Configure Elasticsearch/ELK credentials for strata's elk integration."

branding:
  icon: "shield"
  color: "yellow"

inputs:
  endpoint:
    description: "Elasticsearch endpoint URL (matches the deployment YAML's endpoints.address)."
    required: true
  api-key:
    description: "Elasticsearch API key or token."
    required: true
  api-key-env-var:
    description: "Env var name the API key is written to (referenced by the deployment YAML's secret_ref)."
    required: false
    default: "ELK_API_KEY"

runs:
  using: composite
  steps:
    - name: Configure ELK Environment Variables
      shell: bash
      env:
        _API_KEY: ${{ inputs.api-key }}
        _KEY_VAR: ${{ inputs.api-key-env-var }}
        _ENDPOINT: ${{ inputs.endpoint }}
      run: |
        echo "::add-mask::$_API_KEY"
        printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$_KEY_VAR" "$_API_KEY" >> "$GITHUB_ENV"
        echo "[+] ELK configured (endpoint: $_ENDPOINT)"
