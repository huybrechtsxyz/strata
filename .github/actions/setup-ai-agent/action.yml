# ===============================================================================
# Action Name  : setup-ai-agent
# Description  : Configure credentials for strata's ai_agent integration.
#                `provider` selects which env var (if any) is required —
#                ollama/azure_cli need none, the rest need an API key.
# ===============================================================================

name: "Setup AI Agent"
description: "Configure LLM provider credentials for strata's ai_agent integration."

branding:
  icon: "cpu"
  color: "purple"

inputs:
  provider:
    description: "LLM provider: 'ollama', 'openai', 'azure_openai', 'anthropic', or 'azure_cli'."
    required: true
  api-key:
    description: "Provider API key. Required for openai/azure_openai/anthropic. The env var name written must match the deployment YAML's authentication.api_key.api_key field — default names below are used unless env-var-name is set."
    required: false
    default: ""
  env-var-name:
    description: "Override the env var name the API key is written to (must match the deployment YAML's api_key.api_key field)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure AI Provider Environment Variable
      shell: bash
      env:
        _PROVIDER: ${{ inputs.provider }}
        _API_KEY: ${{ inputs.api-key }}
        _ENV_VAR_NAME: ${{ inputs.env-var-name }}
      run: |
        case "$_PROVIDER" in
          ollama|azure_cli)
            echo "[+] AI provider '$_PROVIDER' requires no API key (local/CLI-delegated auth)."
            exit 0
            ;;
          openai)   DEFAULT_VAR="OPENAI_API_KEY" ;;
          azure_openai) DEFAULT_VAR="AZURE_OPENAI_API_KEY" ;;
          anthropic) DEFAULT_VAR="ANTHROPIC_API_KEY" ;;
          *)
            echo "::error::setup-ai-agent: unknown provider '$_PROVIDER'."
            exit 1
            ;;
        esac

        [ -z "$_API_KEY" ] && { echo "::error::setup-ai-agent: provider '$_PROVIDER' requires 'api-key'."; exit 1; }
        VAR_NAME="${_ENV_VAR_NAME:-$DEFAULT_VAR}"
        echo "::add-mask::$_API_KEY"
        printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$VAR_NAME" "$_API_KEY" >> "$GITHUB_ENV"
        echo "[+] AI agent configured (provider: $_PROVIDER, env var: $VAR_NAME)"
