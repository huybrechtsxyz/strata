# ===============================================================================
# Action Name  : run-deployment
# Description  : Execute a strata deployment (plan or apply) from a built
#                platform artifact. Requires setup-strata and build-deployment
#                to have run first.
# ===============================================================================

name: "Run Deployment"
description: "Execute a strata deployment (plan or apply). Requires setup-strata and build-deployment."

branding:
  icon: "play"
  color: "blue"

inputs:
  deployment_file:
    description: "Path to the strata deployment YAML file."
    required: true
  deployment_name:
    description: "Human-readable name of the deployment (used for log output)."
    required: false
    default: ""
  dry_run:
    description: "Run in dry-run mode (plan only, no apply). Set to 'false' to deploy."
    required: false
    default: "true"
  work_path:
    description: "Working directory containing the built .strata/ artifact."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      env:
        DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
        DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        DRY_RUN: ${{ inputs.dry_run }}
        WORK_PATH: ${{ inputs.work_path }}
      run: |
        DRY_RUN_FLAG=""
        MODE_LABEL=$'\U0001F680 Production'
        if [ "$DRY_RUN" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
          MODE_LABEL=$'\u26a0\ufe0f Dry Run'
        fi
        echo "[*] Deploying $DEPLOYMENT_NAME (dry_run=$DRY_RUN) ..."
        set +e
        strata deploy run --file "$DEPLOYMENT_FILE" --work-path "$WORK_PATH" --verbose $DRY_RUN_FLAG
        _EXIT=$?
        set -e
        RESULT=$'\u2705 Success'
        [ $_EXIT -ne 0 ] && RESULT=$'\u274c Failed'
        {
          printf '## Deployment: %s\n\n' "$DEPLOYMENT_NAME"
          printf '| | |\n|---|---|\n'
          printf '| **File** | `%s` |\n' "$DEPLOYMENT_FILE"
          printf '| **Mode** | %s |\n' "$MODE_LABEL"
          printf '| **Result** | %s |\n' "$RESULT"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "[*] Deploying $DEPLOYMENT_NAME ... $([ $_EXIT -eq 0 ] && echo DONE || echo FAILED)"
        exit $_EXIT

    - name: Upload plan artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: terraform-plans-${{ inputs.deployment_name || 'deploy' }}
        path: "**/*.tfplan.json"
        if-no-files-found: ignore
