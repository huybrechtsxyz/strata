# ===============================================================================
# Action Name  : setup-generic-oidc
# Description  : Configure credentials for strata's generic_oidc identity
#                integration (CLI login via any standards-compliant OIDC/
#                OAuth2 provider). API-only — env var names are configurable
#                in the deployment YAML, so this action lets you override them.
# ===============================================================================

name: "Setup Generic OIDC"
description: "Configure client credentials for strata's generic_oidc identity integration."

branding:
  icon: "key"
  color: "gray-dark"

inputs:
  client-id:
    description: "OIDC client ID."
    required: true
  client-secret:
    description: "OIDC client secret."
    required: false
    default: ""
  client-id-env-var:
    description: "Env var name the client ID is written to (must match the deployment YAML's authentication.oauth2.client_id field)."
    required: false
    default: "OIDC_CLIENT_ID"
  client-secret-env-var:
    description: "Env var name the client secret is written to (must match authentication.oauth2.client_secret)."
    required: false
    default: "OIDC_CLIENT_SECRET"

runs:
  using: composite
  steps:
    - name: Configure Generic OIDC Environment Variables
      shell: bash
      env:
        _CLIENT_ID: ${{ inputs.client-id }}
        _CLIENT_SECRET: ${{ inputs.client-secret }}
        _ID_VAR: ${{ inputs.client-id-env-var }}
        _SECRET_VAR: ${{ inputs.client-secret-env-var }}
      run: |
        [ -n "$_CLIENT_SECRET" ] && echo "::add-mask::$_CLIENT_SECRET"
        _write_env() {
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$1" "$2" >> "$GITHUB_ENV"
        }
        _write_env "$_ID_VAR" "$_CLIENT_ID"
        [ -n "$_CLIENT_SECRET" ] && _write_env "$_SECRET_VAR" "$_CLIENT_SECRET"
        echo "[+] Generic OIDC configured ($_ID_VAR)"
