# ===============================================================================
# Action Name  : setup-syslog
# Description  : Configure credentials for strata's syslog SIEM sink
#                integration. Mostly connection settings — no secret in the
#                common (unauthenticated UDP/TCP syslog) case.
# ===============================================================================

name: "Setup Syslog"
description: "Configure syslog sink connection settings for strata's syslog integration."

branding:
  icon: "send"
  color: "gray-dark"

inputs:
  host:
    description: "Syslog server host (matches the deployment YAML's endpoints.address)."
    required: true
  auth-token:
    description: "Auth token, if the syslog relay requires one (e.g. TLS-terminated relay in front of syslog)."
    required: false
    default: ""
  auth-token-env-var:
    description: "Env var name the token is written to (referenced by the deployment YAML's secret_ref)."
    required: false
    default: "SYSLOG_AUTH_TOKEN"

runs:
  using: composite
  steps:
    - name: Configure Syslog Environment Variables
      shell: bash
      env:
        _TOKEN: ${{ inputs.auth-token }}
        _TOKEN_VAR: ${{ inputs.auth-token-env-var }}
        _HOST: ${{ inputs.host }}
      run: |
        if [ -n "$_TOKEN" ]; then
          echo "::add-mask::$_TOKEN"
          printf '%s<<__STRATA_DELIM__\n%s\n__STRATA_DELIM__\n' "$_TOKEN_VAR" "$_TOKEN" >> "$GITHUB_ENV"
        fi
        echo "[+] Syslog configured (host: $_HOST)"
