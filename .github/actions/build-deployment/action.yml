# ===============================================================================
# Action Name  : build-deployment
# Description  : Build the strata platform artifact from a deployment file.
#                Writes output to the .strata/ directory in the work path.
#                Requires setup-strata to have run first.
# ===============================================================================

name: "Build Deployment"
description: "Build the strata platform artifact from a deployment file. Requires setup-strata."

branding:
  icon: "package"
  color: "blue"

inputs:
  deployment_file:
    description: "Path to the strata deployment YAML file."
    required: true
  work_path:
    description: "Working directory for the build output (.strata/ is written here)."
    required: false
    default: "."
  deployment_name:
    description: "Name used for the uploaded artifact (strata-build-{name}). Defaults to the deployment file basename."
    required: false
    default: ""
  upload_artifact:
    description: "Upload the .strata/ build output as a GitHub Actions artifact. Set to 'false' to skip."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
        WORK_PATH: ${{ inputs.work_path }}
      run: |
        echo "[*] Building platform artifact ..."
        set +e
        strata build run --file "$DEPLOYMENT_FILE" --work-path "$WORK_PATH"
        _EXIT=$?
        set -e
        if [ $_EXIT -eq 0 ]; then
          printf '## \u2705 Build Succeeded\n\n**File:** `%s`\n' "$DEPLOYMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "[*] Building platform artifact ... DONE"
        else
          printf '## \u274c Build Failed\n\n**File:** `%s`\n' "$DEPLOYMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "[*] Building platform artifact ... FAILED"
        fi
        exit $_EXIT

    # Upload the .strata/ build output so it is available for inspection and
    # debugging even when the deploy step fails. Runs after both success and
    # failure; skipped only when upload_artifact is explicitly set to 'false'.
    - name: Upload Build Artifact
      if: ${{ always() && inputs.upload_artifact != 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: strata-build-${{ inputs.deployment_name || github.run_id }}
        path: ${{ inputs.work_path }}/.strata/
        if-no-files-found: ignore
