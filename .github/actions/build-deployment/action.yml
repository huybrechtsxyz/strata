# ===============================================================================
# Action Name  : build-deployment
# Description  : Build the strata platform artifact from a deployment file.
#                Writes output to the .strata/ directory in the work path.
#                Requires setup-strata to have run first.
# ===============================================================================

name: "Build Deployment"
description: "Build the strata platform artifact from a deployment file. Requires setup-strata."

branding:
  icon: "package"
  color: "blue"

inputs:
  deployment_file:
    description: "Path to the strata deployment YAML file."
    required: true
  work_path:
    description: "Working directory for the build output (.strata/ is written here)."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
        WORK_PATH: ${{ inputs.work_path }}
      run: |
        echo "[*] Building platform artifact ..."
        strata build run --file "$DEPLOYMENT_FILE" --work-path "$WORK_PATH"
        echo "[*] Building platform artifact ... DONE"
