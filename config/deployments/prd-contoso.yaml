apiVersion: strata.huybrechts.xyz/v2
kind: deployment
meta:
  name: prd-contoso-deployment
  annotations:
    description: "Production instance serving customer contoso's own API definitions"
  tags: ["production"]
spec:
  extends: deploy-base

  environments:
    - prd

  tenant: contoso

  # Takes the pins in versions/prd.yaml, including `pins.assets` for contoso-api.
  version: prd

  # Rebinds the workspace's `api` asset slot (workspaces/main.yaml). IaC code
  # still reads `local.strata_assets.api`; only the bound document changes.
  assets:
    - slot: api
      asset: contoso-api
