apiVersion: strata.huybrechts.xyz/v2
kind: solution
meta:
  name: example
  annotations:
    description: "Example solution used to exercise the discovery loader and the full strata build run pipeline end to end"
spec:
  # This example's root IS config/, so Configuration sits beside this file.
  configuration: configuration.yaml
  discovery:
    exclude:
      # Scaffolding: strata-shaped YAML with placeholders that would
      # otherwise index as bogus documents. Additive to the loader's
      # built-in ignores (.git, build, .strata, tool caches).
      - "templates/**"
  remotes:
    - name: infra
      type: local
      url: vendor/infra
      description: "Local stand-in for a real Terraform module registry — a `git`-type remote works identically for `resolve_remote()`/`sync_source()`, but would need a real reachable repository for `strata build run` to actually succeed here; kept local so the example builds end to end with no network access."
    - name: charts
      type: helm
      url: https://charts.example.io
    - name: bundled
      type: local
      url: modules
