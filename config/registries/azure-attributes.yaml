apiVersion: strata.huybrechts.xyz/v2
kind: attributeconfig
meta:
  name: azure-storage-account-configuration
  annotations:
    description: "Replaces the old providerconfig-embedded schema for storage_account (docs/design/dynamic-configuration-validation.md, D5 option c)."
spec:
  target:
    kind: resource
    block: configuration
    view: document
    selector:
      spec.provider_type: azure
      spec.resource_type: storage_account
  schema:
    type: object
    required: [account_tier]
    additionalProperties: false
    properties:
      account_tier:
        type: string
        pattern: "^(Standard|Premium)$"
---
