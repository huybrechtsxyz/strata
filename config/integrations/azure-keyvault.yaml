apiVersion: strata.huybrechts.xyz/v2
kind: integration
meta:
  name: azure-keyvault
spec:
  type: azure-keyvault
  capabilities: [secrets]
  description: "Azure Key Vault - resolves ${secret:KEY} tokens whose store is azure-keyvault; such a secret's value is the secret's name in this vault, never a URL. (The app-gateway-waf resource's certificate is passed by address as a variable instead, so App Gateway reads it itself - see docs/how-to/azure-certificates.md.)"
  required: false
  enabled: true
  authentication:
    method: managed_identity
    managed_identity:
      use_managed_identity: true
