apiVersion: strata.huybrechts.xyz/v1
kind: configuration
meta:
  name: aws_eks_config
  annotations:
    description: AWS EKS platform — Terraform + Helm on Elastic Kubernetes Service
  labels:
    version: "1.0.0"
  tags: [aws, eks, configuration]
spec:
  layering:
    - name: environment
      description: "Deployment environment (dev, staging, prd)"
      required: true

  deployment:
    additional_properties: false
    properties:
      environment:
        pattern: "^(dev|staging|prd)$"
        required: true
        description: "Target environment"

  zones:
    - name: us_east
      description: "US East (N. Virginia, Ohio)"
      regions:
        - us-east-1
        - us-east-2
    - name: eu_west
      description: "Europe (Ireland, Frankfurt)"
      regions:
        - eu-west-1
        - eu-central-1

  remotes:
    - name: aws_eks
      type: gitops
      repository: git@github.com:your-org/aws-eks-config.git
      reference: main
      source_path: .
      deploy_path: .

  integrations:
    - name: git
      type: git
      capabilities: [repository]
      required: true
      validation:
        command: git --version
        min_version: "2.30.0"
      authentication:
        method: cli

    - name: terraform
      type: terraform
      capabilities: [infrastructure]
      required: true
      validation:
        command: terraform --version
        min_version: "1.6.0"
      authentication:
        method: cli

    - name: aws_cli
      type: aws_cli
      capabilities: [infrastructure]
      required: true
      validation:
        command: aws --version
      authentication:
        method: cli

    - name: kubectl
      type: kubectl
      capabilities: [container]
      required: true
      validation:
        command: kubectl version --client
      authentication:
        method: cli

    - name: infracost
      type: infracost
      capabilities: [cost]
      required: false
      validation:
        command: infracost --version
        min_version: "0.10.0"
      authentication:
        method: cli

    - name: helm
      type: helm
      capabilities: [container]
      required: true
      validation:
        command: helm version
        min_version: "3.12.0"
      authentication:
        method: cli
