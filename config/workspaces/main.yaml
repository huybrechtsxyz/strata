apiVersion: strata.huybrechts.xyz/v2
kind: workspace
meta:
  name: main
spec:
  # Three sibling keys, three different questions:
  #   providers    - where: which platform/account
  #   provisioners - with what: tool definitions
  #   execution    - what runs, in what order
  providers:
    - azure-main
  namespaces:
    - hearth
  provisioners:
    - name: terraform-main
      tool: terraform
      source:
        remote: infra
        source_path: terraform/main
      backend:
        type: azurerm
        configuration:
          resource_group_name: tfstate-rg
  resources:
    # `name` is the workspace-local instance; `resource` names the Resource
    # document it is built from (ADR-0015).
    - name: web-storage
      resource: storage-account
      role: control-plane
    - name: web-vm
      resource: linux-vm
      role: worker
      count: 2
  # The ordered recipe. Deployments supply runtime parameters per step via
  # `stages[].step`, but never redefine the recipe itself (ADR-0011).
  execution:
    - name: provision-infra
      provisioner: terraform-main
      targets:
        - web-storage
        - web-vm
  topology:
    - main-topology
  default_tags:
    managed-by: strata
