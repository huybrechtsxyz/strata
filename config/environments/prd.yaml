apiVersion: strata.huybrechts.xyz/v2
kind: environment
meta:
  name: prd
  annotations:
    description: "Example production environment"
  tags: ["example", "production"]
spec:
  properties:
    tier: production

  # What '${var:KEY}' tokens resolve against.
  variables:
    - key: PUBLIC_IP
      store: constant
      value: "203.0.113.10"
      description: "Public IP fronting the example service"
    - key: REGION
      store: constant
      value: westeurope

  # '${secret:KEY}'. Built-in stores (constant/environment/github) resolve
  # directly; anything else names an integration-backed store.
  secrets:
    - key: DB_PASSWORD
      store: environment
      value: EXAMPLE_DB_PASSWORD
      description: "Read from the EXAMPLE_DB_PASSWORD environment variable"
    - key: AUTHENTIK_POSTGRESQL__PASSWORD
      store: constant
      value: "example-not-a-real-secret"
      description: "Placeholder — the authentik module's real secret would come from an integration-backed store"
    - key: AUTHENTIK_SECRET_KEY
      store: constant
      value: "example-not-a-real-secret"
      description: "Placeholder — the authentik module's real secret would come from an integration-backed store"
    - key: APPGW_CERT_SECRET_ID
      store: azure-keyvault
      value: "https://kv-example.vault.azure.net/secrets/appgw-cert"
      description: "App Gateway's HTTPS listener certificate. The cert itself is issued/renewed in Key Vault out-of-band — a Key Vault-integrated CA issuer (DigiCert/GlobalSign), or Key Vault Acmebot for Let's Encrypt — never generated or uploaded by strata/Terraform. This value only names the existing secret; the azure-keyvault integration resolves it at deploy time."

  # '${feature:KEY}'.
  features:
    - key: ENABLE_TRACING
      store: constant
      value: "true"
