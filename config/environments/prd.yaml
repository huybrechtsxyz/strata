apiVersion: strata.huybrechts.xyz/v2
kind: environment
meta:
  name: prd
  annotations:
    description: "Example production environment"
  tags: ["example", "production"]
spec:
  properties:
    deploy_tier: production

  # What '${var:KEY}' tokens resolve against.
  variables:
    - key: PUBLIC_IP
      store: constant
      value: "203.0.113.10"
      description: "Public IP fronting the example service"
    - key: REGION
      store: constant
      value: westeurope
    - key: API_IMAGE_TAG
      store: artifact
      value: example-api
      field: image_tag
      description: "Tag of the example-api image, with any version pin applied (versions/prd.yaml)"
    - key: APPGW_CERT_SECRET_ID
      store: constant
      value: "https://kv-example.vault.azure.net/secrets/appgw-cert"
      description: "Address of the Key Vault secret holding App Gateway's HTTPS listener certificate. A variable, not a secret: App Gateway needs the address and reads and rotates the certificate itself; strata never reads the certificate. The cert is issued/renewed in Key Vault out-of-band — a Key Vault-integrated CA issuer (DigiCert/GlobalSign), or Key Vault Acmebot for Let's Encrypt — never generated or uploaded by strata/Terraform."

  # '${secret:KEY}'. Built-in stores (constant/environment/github) resolve
  # directly; anything else names an integration-backed store.
  secrets:
    - key: DB_PASSWORD
      store: environment
      value: EXAMPLE_DB_PASSWORD
      description: "Read from the EXAMPLE_DB_PASSWORD environment variable"
    - key: AUTHENTIK_POSTGRESQL__PASSWORD
      store: constant
      value: "example-not-a-real-secret"
      description: "Placeholder — the authentik module's real secret would come from an integration-backed store"
    - key: AUTHENTIK_SECRET_KEY
      store: constant
      value: "example-not-a-real-secret"
      description: "Placeholder — the authentik module's real secret would come from an integration-backed store"
    - key: CUSTOMER_GIT_TOKEN
      store: environment
      value: CUSTOMER_REPOS_PAT
      description: "Read-only token for the customers' git repositories (integrations/git-customers.yaml). Only needed while building a deployment that clones one; a CI secret mapped to the CUSTOMER_REPOS_PAT environment variable. An integration-backed store (Key Vault) also works with `build run --resolve`."

  # '${feature:KEY}'.
  features:
    - key: ENABLE_TRACING
      store: constant
      value: "true"
