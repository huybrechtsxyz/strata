apiVersion: platform.huybrechts.xyz/v1
kind: workspace
meta:
  name: xyz_platform
  annotations:
    description: Platform Workspace on Kamatera
  labels:
    version: "1.0.0"
  tags: ["platform", "infrastructure", "kamatera"]
spec:
  providers:
    - name: kamatera_eu_fr
      file: config/xyz/providers/xyz-eu-fr.yaml

  provisioners:
    - name: xyz_iac
      provisioner: terraform
      repository: xyz_deploy    # Reference to repository defined in xyz-config.yaml
      path: terraform           # Relative path within that repository

  topology:
    - name: xzy_swarm
      provider: kamatera_eu_fr
      provisioner: terraform
      type: docker_swarm
      volumes:
        - name: config
          type: replicated
        - name: docs
          type: replicated
        - name: data
          type: local
        - name: logs
          type: local
        - name: serve
          type: distributed
      components:
        # All component details are defined in resources section
        - resource: xyz_vm_manager
        - resource: xyz_vm_infra
        - resource: xyz_vm_worker
  
  resources:
    - name: xyz_vm_manager
      file: config/xyz/resources/xyz-vm-manager.yaml
      role: manager
      count: 1
      firewalls:
        - xyz_fw
    - name: xyz_vm_infra
      file: config/xyz/resources/xyz-vm-infra.yaml
      role: worker
      count: 2
      firewalls:
        - xyz_fw
    - name: xyz_vm_worker
      file: config/xyz/resources/xyz-vm-worker.yaml
      role: worker
      count: 2
      firewalls:
        - xyz_fw

  namespaces:
    - name: xyz_base
      file: config/xyz/namespaces/xyz-base.yaml

  firewalls:
    - name: xyz_fw
      file: config/xyz/firewalls/xyz-fw.yaml
