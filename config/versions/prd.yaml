apiVersion: strata.huybrechts.xyz/v2
kind: version
meta:
  name: prd
  annotations:
    description: "Pins for the production rollout"
spec:
  # Rationale lives in the schema, not in comments: `strata` tooling may
  # rewrite `version`/`available` freely, but `reason` survives. A pin that is
  # held or unverified must say why, so no upgrade review ever has to
  # reconstruct the decision from git history.
  pins:
    images:
      # Shorthand — nothing is being held back.
      caddy: caddy:2-alpine
      # Structured — deliberately behind upstream, and it says so.
      db:
        version: docker.io/library/postgres:16-alpine
        status: held
        available: 18.6-alpine
        reason: "postgres majors need pg_upgrade/dump-restore; plan as its own migration task"
        reviewed: 2026-09-08
    charts:
      immich: 0.13.1
      gatus:
        version: 1.0.0
        status: unverified
        reason: "chart version could not be confirmed upstream; re-verify before bumping"
        reviewed: 2026-09-08
    remotes:
      # Overrides `reference` for the 'infra' remote declared in strata.yaml.
      # Only valid because that remote is `fetch: strata` — a `fetch: external`
      # remote is placed by CI before strata runs, so pinning it cannot work.
      infra: v1.0.0
    # No `tools:` category. CI installs the tool binaries (setup-terraform,
    # setup-helm), so strata cannot make a tool be a given version. The version
    # a recipe expects lives on the provisioner as an assertion instead.
