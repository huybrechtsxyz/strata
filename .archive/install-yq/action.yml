# ==============================================================================
# Workflow Name : Get YQ
# File Name     : action.yaml
# Description   : This GitHub Action retrieves the latest version of the 'yq' tool,
#
# Author        : Vincent Huybrechts
# Created       : 2025-09-09
# Last Updated  : 2025-09-09
# Version       : 1.0.0
# ==============================================================================

name: Get YQ CLI
description: Install YQ (Mike Farah version)

runs:
  using: composite
  steps:
    # Download the latest yq binary from GitHub releases
    - name: Download YQ
      shell: bash
      run: |
        # Fetch the latest version tag from GitHub API
        YQ_VERSION=$(curl -s https://api.github.com/repos/mikefarah/yq/releases/latest | grep tag_name | cut -d '"' -f 4)
        # Download the Linux amd64 binary for the latest version
        curl -L "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
        # Make the binary executable
        chmod +x /usr/local/bin/yq

    # Verify the installed yq version to confirm installation success
    - name: Verify YQ
      shell: bash
      run: yq --version
