# ==============================================================================
# Workflow Name : Has Changes
# File Name     : action.yml
# Description   : Checks if a directory has changed since the last successful run
#                 by hashing its contents and comparing against a cached key.
#                 No external scripts required.
#
# Author        : Vincent Huybrechts
# Created       : 2025-10-20
# Last Updated  : 2026-05-07
# Version       : 2.0.0
# ==============================================================================

name: Has Changes
description: Checks if a directory has changed since the last successful run

inputs:
  workspace_name:
    description: "Name of the workspace"
    required: true
  hashfile:
    description: "Path to hash file"
    required: true
  dir:
    description: "Directory to check for changes"
    required: true

outputs:
  changed:
    description: "true if directory contents have changed since last run"
    value: ${{ steps.set-output.outputs.changed }}

runs:
  using: "composite"
  steps:
    # Compute a stable hash of all files in the target directory
    - name: Compute Directory Hash
      id: hash
      shell: bash
      run: |
        HASH=$(find "${{ inputs.dir }}" -type f | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "value=$HASH" >> "$GITHUB_OUTPUT"
        mkdir -p "$(dirname "${{ inputs.hashfile }}")"
        echo "$HASH" > "${{ inputs.hashfile }}"

    # Cache hit  = same hash seen before = no changes
    # Cache miss = new hash             = changes detected; cache is saved at job end
    - name: Restore Hash from Cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.hashfile }}
        key: xyz-hash-${{ inputs.workspace_name }}-${{ inputs.dir }}-${{
          steps.hash.outputs.value }}

    - name: Set Changed Output
      id: set-output
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected in ${{ inputs.dir }}"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changes detected in ${{ inputs.dir }}"
        fi
