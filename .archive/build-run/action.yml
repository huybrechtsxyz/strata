# ===============================================================================
# Action Name  : build-run
# Description  : Run strata build to generate Terraform artifacts.
# ===============================================================================

name: "Strata Build Run"
description: "Generate Terraform artifacts from a deployment definition."

inputs:
  file:
    description: "Path to the deployment YAML file."
    required: true
  work-path:
    description: "Workspace root directory."
    required: false
    default: "."
  dry-run:
    description: "Validate and plan without writing output files."
    required: false
    default: "false"
  extra-args:
    description: "Additional arguments to pass to strata build run."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Numeric exit code."
    value: ${{ steps.run.outputs.exit-code }}
  success:
    description: "Whether build succeeded (true/false)."
    value: ${{ steps.run.outputs.success }}
  result:
    description: "Raw JSON output from strata build run."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run strata build run
      id: run
      shell: bash
      run: |
        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
        fi

        set +e
        RESULT=$(strata build run --file "${{ inputs.file }}" --work-path "${{ inputs.work-path }}" --output json ${DRY_RUN_FLAG} ${{ inputs.extra-args }} 2>&1)
        EXIT_CODE=$?
        set -e

        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "${RESULT}" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "success=true" >> "$GITHUB_OUTPUT"
          echo "✅ Build completed"
        else
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "❌ Build failed (exit code ${EXIT_CODE})"
        fi

        echo "### Strata Build Run" >> "$GITHUB_STEP_SUMMARY"
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "✅ **Build succeeded**" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ **Build failed** (exit code ${EXIT_CODE})" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit ${EXIT_CODE}
