# ===============================================================================
# Action Name  : deploy-destroy
# Description  : Tear down provisioned infrastructure for a deployment definition.
# ===============================================================================

name: "Strata Deploy Destroy"
description: "Tear down infrastructure for a deployment. Use with caution — requires --force in CI."

inputs:
  file:
    description: "Path to the deployment YAML file."
    required: true
  work-path:
    description: "Workspace root directory."
    required: false
    default: "."
  stage:
    description: "Limit destruction to a specific deployment stage."
    required: false
    default: ""
  force:
    description: "Auto-approve destruction (required for non-interactive CI)."
    required: false
    default: "true"
  dry-run:
    description: "Plan what would be destroyed without removing anything."
    required: false
    default: "false"
  extra-args:
    description: "Additional arguments to pass to strata deploy destroy."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Numeric exit code."
    value: ${{ steps.run.outputs.exit-code }}
  success:
    description: "Whether destroy succeeded (true/false)."
    value: ${{ steps.run.outputs.success }}
  result:
    description: "Raw JSON output from strata deploy destroy."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run strata deploy destroy
      id: run
      shell: bash
      run: |
        STAGE_FLAG=""
        if [ -n "${{ inputs.stage }}" ]; then
          STAGE_FLAG="--stage ${{ inputs.stage }}"
        fi

        FORCE_FLAG=""
        if [ "${{ inputs.force }}" = "true" ]; then
          FORCE_FLAG="--force"
        fi

        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
        fi

        set +e
        RESULT=$(strata deploy destroy --file "${{ inputs.file }}" --work-path "${{ inputs.work-path }}" --output json ${STAGE_FLAG} ${FORCE_FLAG} ${DRY_RUN_FLAG} ${{ inputs.extra-args }} 2>&1)
        EXIT_CODE=$?
        set -e

        echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "${RESULT}" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "success=true" >> "$GITHUB_OUTPUT"
          echo "✅ Destroy completed"
        else
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "❌ Destroy failed (exit code ${EXIT_CODE})"
        fi

        echo "### Strata Deploy Destroy" >> "$GITHUB_STEP_SUMMARY"
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "✅ **Destroy succeeded**" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ **Destroy failed** (exit code ${EXIT_CODE})" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit ${EXIT_CODE}
