# Drift Detection — Reusable Workflow
#
# Orchestrates nightly drift detection across deployments.
# Exit code 3 = drift detected. Exit code 0 = clean.
#
# This workflow is reusable and can be called from other repositories.
#
# Usage (in your repo's workflow):
#
#   jobs:
#     drift:
#       uses: huybrechtsxyz/strata/.github/workflows/drift-check.yml@main
#       with:
#         deployment: deploy/production.yaml
#         severity: high
#       secrets: inherit
#
# Required secrets (set in your repo/environment):
#   AZURE_CLIENT_ID      — Azure service principal client ID
#   AZURE_CLIENT_SECRET  — Azure service principal secret
#   AZURE_TENANT_ID      — Azure tenant ID
#   SLACK_DRIFT_WEBHOOK  — (optional) Slack incoming webhook URL
#
# See .github/actions/drift-check for the underlying action implementation.

name: Infrastructure Drift Detection

on:
  # Run nightly at 02:00 UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger with configurable options
  workflow_dispatch:
    inputs:
      deployment:
        description: "Path to deployment YAML file (required)"
        required: true
      severity:
        description: "Minimum severity threshold (critical/high/medium/low/info)"
        required: false
        default: "high"
      baseline:
        description: "Set current state as baseline (acknowledge all drift, reset history)"
        type: boolean
        required: false
        default: false

  # Callable from other workflows
  workflow_call:
    inputs:
      deployment:
        description: "Path to deployment YAML file (required)"
        type: string
        required: true
      severity:
        description: "Minimum severity threshold"
        type: string
        required: false
        default: "high"
      baseline:
        description: "Set baseline mode"
        type: boolean
        required: false
        default: false
      python-version:
        description: "Python version to use"
        type: string
        required: false
        default: "3.13"
      strata-version:
        description: "Strata version to install (empty = latest)"
        type: string
        required: false
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      SLACK_DRIFT_WEBHOOK:
        required: false

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:
  drift-check:
    name: Drift Check — ${{ inputs.deployment }}
    runs-on: ubuntu-latest

    # Permissions needed for OIDC auth
    permissions:
      contents: read
      id-token: write

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Authenticate to cloud (Azure example — override in your repo)
      # -----------------------------------------------------------------------
      - name: Authenticate to Azure (service principal)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant  "${{ secrets.AZURE_TENANT_ID }}"
        env:
          AZURE_CONFIG_DIR: /tmp/.azure

      # -----------------------------------------------------------------------
      # 3. Run drift detection (delegated to composite action)
      # -----------------------------------------------------------------------
      - name: Detect infrastructure drift
        id: drift
        uses: huybrechtsxyz/strata/.github/actions/drift-check@main
        with:
          deployment: ${{ inputs.deployment }}
          severity: ${{ inputs.severity }}
          baseline: ${{ inputs.baseline }}
          python-version: ${{ inputs.python-version || '3.13' }}
          strata-version: ${{ inputs.strata-version }}

      # -----------------------------------------------------------------------
      # 4. Post critical drift to Slack (optional)
      # -----------------------------------------------------------------------
      - name: Post drift summary to Slack
        if: |
          steps.drift.outputs.exit-code == '3' &&
          secrets.SLACK_DRIFT_WEBHOOK != ''
        run: |
          DEPLOYMENT="${{ inputs.deployment }}"
          TOTAL="${{ steps.drift.outputs.total }}"
          CRITICAL="${{ steps.drift.outputs.critical }}"
          HIGH="${{ steps.drift.outputs.high }}"

          ENTRIES=$(python3 - <<'EOF'
          import json
          try:
              with open("drift-report.json") as f:
                  report = json.load(f)
              entries = report.get("data", {}).get("entries", [])
              lines = []
              for e in entries[:10]:
                  sev = e.get("severity", "?").upper()
                  addr = e.get("address", "?")
                  action = e.get("action", "?")
                  lines.append(f"• [{sev}] {addr} ({action})")
              if len(entries) > 10:
                  lines.append(f"... and {len(entries) - 10} more")
              print("\n".join(lines))
          except Exception as ex:
              print(f"(failed to parse report: {ex})")
          EOF
          )

          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'text': ':rotating_light: *Drift detected* in \`$DEPLOYMENT\`',
            'blocks': [
              {'type': 'section', 'text': {'type': 'mrkdwn',
                'text': ':rotating_light: *Infrastructure drift detected*\n'
                        '*Deployment:* \`$DEPLOYMENT\`\n'
                        '*Total:* $TOTAL entries ($CRITICAL critical, $HIGH high)\n'
                        '*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>'
              }},
              {'type': 'section', 'text': {'type': 'mrkdwn', 'text': '\`\`\`${ENTRIES}\`\`\`'}}
            ]
          }
          print(json.dumps(payload))
          ")

          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_DRIFT_WEBHOOK }}"

      # -----------------------------------------------------------------------
      # 5. Fail the job if drift was found above threshold
      # -----------------------------------------------------------------------
      - name: Fail on drift
        if: steps.drift.outputs.exit-code == '3'
        run: |
          echo "::error::Drift detected. See drift-report artifact for details."
          exit 3

      - name: Report clean result
        if: steps.drift.outputs.exit-code == '0'
        run: echo "✓ No drift detected at or above the '${{ inputs.severity }}' threshold."
