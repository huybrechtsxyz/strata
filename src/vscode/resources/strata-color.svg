<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Strata brand mark — bold "S" built from four offset, overlapping
    copies (deep navy in back, bright teal in front), evoking stacked
    layers without a tapering peak. Use wherever full color is supported
    (marketplace icon, docs, README, social/og images). For monochrome
    contexts (VS Code activity bar, which masks icons to a single theme
    color) use strata.svg.
  -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#122030"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15" text-anchor="middle">
    <text x="11.6" y="17.0" transform="translate(-1.2,-1.2)" fill="#14283C">S</text>
    <text x="11.6" y="17.0" transform="translate(-0.8,-0.8)" fill="#1C6693">S</text>
    <text x="11.6" y="17.0" transform="translate(-0.4,-0.4)" fill="#1E93A8">S</text>
    <text x="11.6" y="17.0" fill="#35C7B8">S</text>
  </g>
</svg>

