<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Strata brand mark — four offset parallelogram "slabs" arranged in a
    basket-weave 2x2 grid (deep navy in back, bright teal in front),
    evoking stacked rock layers with the same bold geometric, flat-shape
    language as the Terraform mark. Use wherever full color is supported
    (marketplace icon, docs, README, social/og images). For monochrome
    contexts (VS Code activity bar, which masks icons to a single theme
    color) use strata.svg.
  -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#122030"/>
  <polygon points="5,2 13,2 11,9 3,9" fill="#14283C"/>
  <polygon points="13,6.3 21,6.3 19,13.3 11,13.3" fill="#1C6693"/>
  <polygon points="5,10.5 13,10.5 11,17.5 3,17.5" fill="#1E93A8"/>
  <polygon points="13,14.8 21,14.8 19,21.8 11,21.8" fill="#35C7B8"/>
</svg>

