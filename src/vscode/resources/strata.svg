<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Strata icon — four offset parallelogram "slabs" in a basket-weave 2x2
    grid, darkest/furthest in back and full-opacity in front. Rendered as
    a mask in the VS Code activity bar, so only currentColor + opacity are
    used here. See strata-color.svg for the full-color brand mark.
  -->
  <polygon points="5,2 13,2 11,9 3,9" fill="currentColor" opacity="0.6"/>
  <polygon points="13,6.3 21,6.3 19,13.3 11,13.3" fill="currentColor" opacity="0.75"/>
  <polygon points="5,10.5 13,10.5 11,17.5 3,17.5" fill="currentColor" opacity="0.9"/>
  <polygon points="13,14.8 21,14.8 19,21.8 11,21.8" fill="currentColor" opacity="1"/>
</svg>
