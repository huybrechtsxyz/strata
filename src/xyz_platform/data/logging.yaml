# ===============================================================================
# Logging Configuration (Serilog-style for Python)
# ===============================================================================
# This YAML file configures logging using Python's standard logging.config.dictConfig
# Similar to Serilog's configuration in .NET
#
# Standard frameworks used:
# - python-json-logger: JSON formatting for ELK
# - azure-monitor-opentelemetry: Azure Application Insights
# ===============================================================================

version: 1
disable_existing_loggers: false

# ===============================================================================
# Formatters - How logs are formatted
# ===============================================================================
formatters:
  # Console formatter - human-readable with colors (development)
  console:
    (): xyz_platform.logger.formatters.ConsoleFormatter
    use_colors: true

  # JSON formatter - structured logging for ELK (production)
  json:
    (): xyz_platform.logger.formatters.JsonFormatter

# ===============================================================================
# Handlers - Where logs are sent
# ===============================================================================
handlers:
  # Console output (development) - commented out by default
  # console:
  #   class: logging.StreamHandler
  #   level: DEBUG
  #   formatter: console
  #   stream: ext://sys.stdout

  # JSON file output (local ELK testing)
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: .xyz-platform/logging.json
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  # Logstash output (ELK stack - production)
  logstash:
    (): xyz_platform.logger.handlers.LogstashHandler
    level: INFO
    formatter: json
    host: localhost
    port: 5000
    timeout: 5

# ===============================================================================
# Loggers - Configure logging for different modules
# ===============================================================================
loggers:
  # xyz_platform logger
  xyz_platform:
    level: DEBUG
    handlers: [file]
    propagate: false

  # Third-party libraries (reduce noise)
  urllib3:
    level: WARNING
  requests:
    level: WARNING
  paramiko:
    level: WARNING

# Root logger (fallback)
root:
  level: DEBUG
  handlers: [file]

# ===============================================================================
# Azure Application Insights Configuration
# ===============================================================================
# Azure is configured separately via OpenTelemetry
# Set environment variable: APPLICATIONINSIGHTS_CONNECTION_STRING
# Or configure programmatically in code
# ===============================================================================
azure:
  enabled: false
  # connection_string: "InstrumentationKey=xxx;IngestionEndpoint=https://..."
  # Or use environment variable: APPLICATIONINSIGHTS_CONNECTION_STRING
