# ===============================================================================
# Package-level fallback logging configuration
# ===============================================================================
# Loaded by the CLI at startup before any workspace is known.
# Console-only at WARNING level — quiet by default.
# Once a workspace is open, .strata/logging.yaml overrides this.
# ===============================================================================

version: 1
disable_existing_loggers: false

formatters:
  console:
    (): strata.logger.formatters.make_console_formatter

handlers:
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: console
    stream: ext://sys.stderr

loggers:
  strata:
    level: WARNING
    handlers: [ console ]
    propagate: false

  urllib3:
    level: ERROR
  requests:
    level: ERROR
  paramiko:
    level: ERROR

root:
  level: WARNING
  handlers: [ console ]

# ===============================================================================
# Azure Application Insights Configuration
# ===============================================================================
# Azure is configured separately via OpenTelemetry
# Set environment variable: APPLICATIONINSIGHTS_CONNECTION_STRING
# Or configure programmatically in code
# ===============================================================================
azure:
  enabled: false
  # connection_string: "InstrumentationKey=xxx;IngestionEndpoint=https://..."
  # Or use environment variable: APPLICATIONINSIGHTS_CONNECTION_STRING

# ===============================================================================
# Audit Log Configuration
# ===============================================================================
# Configures the dedicated NDJSON audit log (user actions + outcomes).
# Omit this section to use the default: .strata/audit.log with size-based rotation.
# ===============================================================================
# audit:
#   path: .strata/audit.log       # Override to an absolute path for production
#   rotation: size                 # size | daily
#   max_bytes: 5242880             # 5 MB — used when rotation: size
#   backup_count: 3                # rotated files to keep
#   date_suffix: "%Y%m%d"          # used when rotation: daily (e.g. audit.log.20260524)
