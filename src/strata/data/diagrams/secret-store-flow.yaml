apiVersion: strata.huybrechts.xyz/v1
kind: diagram
meta:
  name: secret-store-flow
  annotations:
    description: "Flow of declared secrets from store backend to environment (count of secrets per store→environment pair). Honestly scoped to two tiers — a third 'to deployment' hop (as in the catalog's Value Source Traceability entry) would need the deployment name exposed by the 'secrets' source, which today reports only {store, environment}. Mermaid sankey diagrams encode volume via flow width, not color (ADR-0034 styling constraints)."
  labels:
    version: "1.0.0"
  tags:
    - built-in
spec:
  sources:
    - type: secrets
      as: sec
  template: |
    sankey-beta

    {% for store, store_nodes in sec.nodes | groupby('metadata.store') %}
    {%- for env, env_nodes in store_nodes | groupby('metadata.environment') %}
    {{ store }},{{ env }},{{ env_nodes | list | length }}
    {%- endfor %}
    {%- endfor %}
