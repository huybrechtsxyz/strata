# Configuration Template
# Copy this file and customize for your platform configuration
#
# Usage: cp config/template/configurations/template-config.yaml config/{platform}/configurations/{name}-config.yaml

apiVersion: strata.huybrechts.xyz/v1
kind: configuration
meta:
  name: { { name } }
  annotations:
    description: "Configuration template for platform setup"
    owner: { { owner } }
  labels:
    version: { { version } }
    environment: "template"
  tags: ["template", "example"]
spec:
  # Define deployment layering hierarchy (optional)
  # Used to construct artifact_path from deployment.spec.deployment values
  layering:
    - name: tenant
      required: false
      default: "default"
      description: "Tenant identifier"
    - name: region
      required: false
      default: "global"
      description: "Geographic region"
    - name: environment
      required: true
      description: "Environment (dev/staging/production)"

  # Platform-specific properties
  properties:
    platform_version: "1.0.0"
    api_version: "v1"
    # Add custom properties as needed

  # Integrations — external tools and services
  # integrations:
  #
  #   # AI advisory analysis (ADR-0025) — run `strata help --topic ai_agent` for details
  #   - name: ai-advisor
  #     type: ai_agent
  #     endpoints:
  #       address: https://my-aoai.openai.azure.com/   # omit for Ollama
  #     authentication:
  #       method: cli                                  # cli = az login, no stored key
  #     properties:
  #       provider: azure_cli                          # ollama | openai | azure_openai | anthropic | azure_cli
  #       model: gpt-4o
  #       temperature: 0.1
  #       max_tokens: 4096
  #       timeout: 60
  #       enabled_hooks: []                            # add hooks to auto-invoke, e.g. [deploy_plan_after]
