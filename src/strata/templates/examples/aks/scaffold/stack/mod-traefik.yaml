apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: {{ solution_name }}_mod_traefik
  annotations:
    description: Traefik ingress controller deployed via Helm
  labels:
    version: "1.0.0"
  tags: [{{ solution_name }}, module, traefik, ingress]
spec:
  type: helm
  source:
    chart_repository: https://helm.traefik.io/traefik
    chart_name: traefik
    chart_version: "26.0.0"
  kubernetes_namespace: traefik
  services:
    - name: traefik
      configuration:
        ingressClass:
          enabled: true
          isDefaultClass: true
