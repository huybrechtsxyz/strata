apiVersion: strata.huybrechts.xyz/v1
kind: configuration
meta:
  name: ${solution_name}_config
  annotations:
    description: Azure Kubernetes Service platform configuration for ${solution_name}
  labels:
    version: "1.0.0"
  tags: [${solution_name}, configuration, aks]
spec:
  # Deployment hierarchy — maps to properties in the deployment spec
  layering:
    - name: environment
      description: "Deployment environment (dev, staging, prd)"
      required: true

  # Required properties for every deployment referencing this config
  deployment:
    additional_properties: false
    properties:
      environment:
        pattern: "^(dev|staging|prd)$"
        required: true
        description: "Target environment"

  # Remotes available via @${solution_name}/... references
  remotes:
    - name: ${solution_name}
      type: gitops
      repository: git@github.com:your-org/${solution_name}-config.git
      reference: main
      source_path: .
      deploy_path: .

  # Integrations
  integrations:
    - name: git
      type: git
      capabilities: [repository]
      required: true
      validation:
        command: git --version
        min_version: "2.30.0"
      authentication:
        method: cli

    - name: terraform
      type: terraform
      capabilities: [infrastructure]
      required: true
      validation:
        command: terraform --version
        min_version: "1.6.0"
      authentication:
        method: cli

    - name: azure_cli
      type: azure_cli
      capabilities: [cloud]
      required: true
      validation:
        command: az --version
      authentication:
        method: cli

    - name: kubectl
      type: kubectl
      capabilities: [kubernetes]
      required: true
      validation:
        command: kubectl version --client
      authentication:
        method: cli

    - name: helm
      type: helm
      capabilities: [kubernetes]
      required: true
      validation:
        command: helm version
        min_version: "3.12.0"
      authentication:
        method: cli
