apiVersion: strata.huybrechts.xyz/v1
kind: environment
meta:
  name: {{ solution_name }}_env_prd
  annotations:
    description: Production environment variables for {{ solution_name }}
  labels:
    version: "1.0.0"
  tags: [{{ solution_name }}, production, environment]
spec:
  variables:
    - key: WORKSPACE
      store: constant
      value: {{ solution_name }}
    - key: ENVIRONMENT
      store: constant
      value: prd
    - key: AZURE_SUBSCRIPTION_ID
      store: environment
      value: AZURE_SUBSCRIPTION_ID
    - key: AZURE_RESOURCE_GROUP
      store: constant
      value: rg-{{ solution_name }}-prd-westeurope

  secrets:
    # Azure service principal — used by Terraform
    # Replace with your Key Vault reference or secret manager entry
    - key: ARM_CLIENT_ID
      store: environment
      value: ARM_CLIENT_ID
    - key: ARM_CLIENT_SECRET
      store: environment
      value: ARM_CLIENT_SECRET
    - key: ARM_TENANT_ID
      store: environment
      value: ARM_TENANT_ID
