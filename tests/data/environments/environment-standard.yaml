apiVersion: platform.huybrechts.xyz/v1
kind: environment
meta:
  name: valid_environment
  annotations:
    description: Valid environment example
    owner: example@xyz.com
  labels:
    version: "1.0.0"
    environment: production
    customer: example-xyz
    project: cloud-platform
  tags: ["platform", "infrastructure", "kamatera"]
spec:
  properties:
    region: eu-fr
    vm_type: standard
    enable_monitoring: true
  custom:
    costcenter: "XYZ-PLATFORM"
    notes: "This is a valid environment for testing."
  variables:
    - key: WORKSPACE
      store: constant
      value: platform
    - key: DATACENTER
      store: constant
      value: kamatera-eu-fr
    - key: KAMATERA_MANAGER_ID
      store: constant
      value: manager-1
  secrets:
    - key: TERRAFORM_API_TOKEN
      store: bitwarden
      value: d47e736b-2db8-47d5-b46b-b2c8016ece73
    - key: KAMATERA_API_KEY
      store: bitwarden
      value: 357068b9-9f5f-4f79-940c-b2c8016cb88f
    - key: KAMATERA_API_SECRET
      store: bitwarden
      value: 6c9295a8-9fa4-4d38-8929-b2c8016d9b43
    - key: KAMATERA_PRIVATE_KEY
      store: bitwarden
      value: f16fffe2-77b7-4d20-bf6c-b2c9015c71d3
    - key: KAMATERA_PUBLIC_KEY
      store: bitwarden
      value: 6cc5b975-56a9-4d7a-80c7-b2c90151cce0
    - key: KAMATERA_ROOT_PASSWORD
      store: bitwarden
      value: 5083ae32-429d-428b-b7df-b2c901441bbb
  features:
    - key: enable_auto_scaling
      store: constant
      value: true
