apiVersion: strata.huybrechts.xyz/v1
kind: environment
meta:
  name: test_insecure_secrets
  annotations:
    description: Test environment with insecure secret storage (should fail prod validation)
  labels:
    version: "1.0.0"
    environment: development
spec:
  variables:
    - key: WORKSPACE
      store: constant
      value: platform
      description: "Workspace name"
  
  secrets:
    - key: INSECURE_SECRET
      store: constant
      value: "my-secret-password"
      description: "This uses constant store - insecure for production!"
    
    - key: API_KEY
      store: environment
      value: "API_KEY_ENV_VAR"
      description: "This uses environment variable - insecure for production!"
    
    - key: SECURE_SECRET
      store: bitwarden
      value: d47e736b-2db8-47d5-b46b-b2c8016ece73
      description: "This is secure - uses bitwarden"
