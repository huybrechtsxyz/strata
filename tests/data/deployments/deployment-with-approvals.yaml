apiVersion: strata.huybrechts.xyz/v1
kind: deployment
meta:
  name: platform_prd_approved
  annotations:
    description: Deployment with hand-off gates declared (ADR-0057 / ADR-0059)
  labels:
    version: "1.0.0"
    environment: "production"
spec:
  layers:
    environment: prod

  workspace:
    name: example_xyz_workspace
    description: Standard xyz workspace
    file: tests/data/workspaces/workspace-standard.yaml
  environments:
    - tests/data/environments/environment-standard.yaml

  # Hand-off gates — one list, mode-switched between audit-only and enforcing.
  gates:
    - name: staging-declare
      type: approval
      mode: declare # audit-only — enforcement already happens externally (CI/CD)
      scope: [staging]
      approvers:
        platform-team:
          type: github-team
          value: "org/platform-team"
        devops-lead:
          type: user
          value: "devops@example.com"

    - name: prod-approval
      type: approval
      mode: enforce # strata itself pauses the deploy and requires --resume
      scope: [production]
      approvers:
        platform-team:
          type: github-team
          value: "org/platform-team"
        ado-approvers:
          type: ado-group
          value: "Platform-Approvers"
      min_approvals: 1
      timeout_minutes: 60

  stages:
    - name: staging
      secrets:
        - deploy_token

    - name: production
      secrets:
        - deploy_token
        - db_password

  configurations:
    - name: configuration
      description: Standard configuration
      file: tests/data/configurations/configuration-standard.yaml
