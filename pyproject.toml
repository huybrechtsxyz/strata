[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-v2"
dynamic = ["version"]
description = "Strata v2 - Infrastructure as Code Platform"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "import-linter>=2.0",
    "types-PyYAML",
]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
azure-monitor = [
    "azure-monitor-opentelemetry>=1.6",
]
docs = [
    "sphinx",
    "sphinx-toggleprompt",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "myst_parser",
]

[project.scripts]
strata = "strata.commands.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# VERSION.txt is the single source of the version. Any tool in any language
# reads it with one line — no TOML parser, no Python import — which is what
# lets one release script bump Python, Node and CI together.
[tool.setuptools.dynamic]
version = { file = "VERSION.txt" }

# Discovery rather than an explicit list: `packages = ["strata"]` shipped a
# wheel containing only the top-level package — every subpackage
# (models/services/controllers/utils/logging) was silently omitted, so an
# installed strata could not import itself. Editable installs hid it because
# they resolve to src/.
[tool.setuptools.packages.find]
where = ["src"]
include = ["strata*"]

[tool.setuptools.package-data]
strata = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "src"
exclude = "^tests/"

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "azure.monitor.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "strata"
exclude_type_checking_imports = "True"

[[tool.importlinter.contracts]]
name = "Layered architecture (ADR-0003, ported from v1)"
type = "layers"
layers = [
    "strata.commands",
    "strata.controllers",
    "strata.services",
    "strata.models",
    "strata.utils",
    "strata.logging",
]
# v1's full layering (for reference, extend as these packages are built):
# strata.server > strata.commands > strata.controllers >
# (strata.builders | strata.deployers) > strata.validators > strata.services >
# strata.integrations > strata.models > strata.utils

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
    "docs", # Sphinx docs — RST/MD, not Python
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "N"]
ignore = ["E402", "F841", "E203", "E302", "E305", "E501", "N815"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
