[build-system]
requires = ["setuptools>=70.3.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
authors = [{ name = "Vincent Huybrechts", email = "vincent@huybrechts.xyz" }]
license = { text = "AGPL-3.0-or-later" }
description = "Python infrastructure platform for managing VM workspaces and clusters to deploy and maintain an automated container orchestration platform."
readme = "README.md"
keywords = [
    "infrastructure",
    "platform",
    "orchestration",
    "containers",
    "automation",
]
urls = { Homepage = "https://github.com/huybrechtsxyz/strata", Repository = "https://github.com/huybrechtsxyz/strata", Issues = "https://github.com/huybrechtsxyz/strata/issues" }
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "python-hcl2>=8.0",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.31",
    "paramiko>=3.0",
    "scp>=0.14",
    # Logging - Standard libraries
    "structlog>=24.0",                  # Structured logging (replaces python-json-logger)
    "opentelemetry-api>=1.20",          # OpenTelemetry API
    "opentelemetry-sdk>=1.20",          # OpenTelemetry SDK
    "azure-monitor-opentelemetry>=1.0", # Azure Application Insights
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { file = "VERSION.txt" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"strata.data" = ["*.yaml", "*.txt"]
"strata.templates" = ["*.yaml", "*.json", "*.md", "*.txt"]
"strata.templates.solution" = ["*.yaml", "*.md", "*"]
"strata.templates.integrations" = ["*.md", "*.py"]
"strata.templates.devcontainer" = ["*.json", "*.sh"]

[dependency-groups]
dev = [
    "debugpy",
    "ruff",
    "mypy",
    "nox",
    "pytest",
    "pytest-asyncio==1.3.0",
    "pytest-cov",
    "yamllint",
    "pyyaml > 3.13",
    "types-PyYAML",
]

doc = [
    "sphinx",
    "sphinx-autoapi",
    "sphinx-toggleprompt",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "myst_parser",
    "coverage-badge",
    "anybadge",
]
[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "N"]
ignore = ["E402", "F841", "E203", "E302", "E305", "E501", "N815"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
norecursedirs = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov-report term-missing --cov=src"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore:Field name \"validate\" in \"ProviderLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"ResourceLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"WorkspaceLifecycleModel\".*:UserWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".nox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]
ignore_missing_imports = true

[project.scripts]
strata = "strata.cli:main"
xyz = "strata.cli:main"
