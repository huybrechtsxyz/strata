[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyz-platform"
version = "0.0.1"
description = "Python infrastructure platform for managing VM workspaces and clusters to deploy and maintain an automated container orchestration platform."
authors = [{ name = "Vincent Huybrechts", email = "vincent@huybrechts.xyz" }]
license = { text = "AGPL-3.0-or-later" }
readme = "readme.md"
keywords = [
    "infrastructure",
    "platform",
    "orchestration",
    "containers",
    "automation",
]
urls = { Homepage = "https://github.com/huybrechtsxzy/xyz-platform", Repository = "https://github.com/huybrechtsxzy/xyz-platform", Issues = "https://github.com/huybrechtsxzy/xyz-platform/issues" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

requires-python = ">=3.11" # >= Python 3.14

dependencies = [
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.31",
    "paramiko>=3.0",
    "scp>=0.14",
    # Logging - Standard libraries
    "python-json-logger>=2.0",          # Standard JSON logging for ELK
    "opentelemetry-api>=1.20",          # OpenTelemetry API
    "opentelemetry-sdk>=1.20",          # OpenTelemetry SDK
    "azure-monitor-opentelemetry>=1.0", # Azure Application Insights
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xyz_platform.data" = ["*.yaml", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
#testpaths = ["tests/xyz_platform"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
#addopts = ["--strict-markers", "--strict-config", "--verbose"]
addopts = ["-v", "--tb=short"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore:Field name \"validate\" in \"ProviderLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"ResourceLifecycleModel\".*:UserWarning",
    "ignore:Field name \"validate\" in \"WorkspaceLifecycleModel\".*:UserWarning",
]
