[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-v2"
version = "2.0.0"
description = "Strata v2 - Infrastructure as Code Platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx",
    "sphinx-toggleprompt",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "myst_parser",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["strata"]

[tool.setuptools.package-data]
strata = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.ruff]
line-length = 120
target-version = "py310"
